layer.","Place the included color-palette PNG as an embedded Smart Object; position it over the screen.","Add editable heading, subtitle and call-to-action text in groups."],"expected":"Layout remains aligned and each asset is replaceable without flattening.","why":"Modularity keeps content swaps separate from permanent scene design.","practice":"Swap the placed image with a different PNG while preserving headline placement.","proof":"No overlapping text, inconsistent margins, or misplaced layers.","mistake":"A stretched placeholder can distort imported art; preserve aspect ratio.","tip":"Use consistent margin spacing as a simple design system.","question":"What makes a mockup reusable?","answers":["Repeated destructive crops","Separate editable content and structure","One flattened image"],"correct":1,"explanation":"Modularity keeps content swaps separate from permanent scene design.","use":"Use templates with replaceable Smart Objects for a repeatable campaign or client presentation.","prerequisites":["s07l05"],"next":"s08l01","previous":"s07l05","connections":["s08l01","s07l01"],"completion":["No overlapping text, inconsistent margins, or misplaced layers.","Explain the underlying mechanism in your own words: Modularity keeps content swaps separate from permanent scene design."]},{"id":"s08l01","stage":8,"title":"Histogram, exposure and tonal clipping","objective":"Explain and independently execute histogram, exposure and tonal clipping.","concept":"Histogram graphs the number of pixels at tonal values. It reveals distribution and possible clipping but does not declare a single correct exposure; a night scene may naturally cluster left.","location":"Window > Histogram; Layer > New Adjustment Layer > Levels","steps":["Open practice/tone-gradient.png and show Window > Histogram.","Add a Levels adjustment layer.","Move black and white point sliders inward slowly, watching endpoints; then reset and move midtone slider.","Observe whether fine gradient steps lose distinction near the extremes."],"expected":"Distribution and perceived contrast change; extreme endpoint changes clip detail.","why":"Levels remaps tonal values using input black, gamma-like midtone and white controls.","practice":"Make two versions: gentle contrast and intentionally clipped contrast.","proof":"Explain which image retained more steps in bright and dark regions.","mistake":"Never force every histogram to span full width by habit.","tip":"Use clipping preview methods when available and inspect at 100%.","question":"What does a histogram primarily show?","answers":["Tonal frequency distribution","Exact color truth","Printer resolution"],"correct":0,"explanation":"Levels remaps tonal values using input black, gamma-like midtone and white controls.","use":"Use histograms and Levels to diagnose tonal clipping before interpreting a photograph by screen brightness alone.","prerequisites":["s07l06"],"next":"s08l02","previous":"s07l06","connections":["s08l02","s07l02"],"completion":["Explain which image retained more steps in bright and dark regions.","Explain the underlying mechanism in your own words: Levels remaps tonal values using input black, gamma-like midtone and white controls."]},{"id":"s08l02","stage":8,"title":"Curves and channel-level color balance","objective":"Explain and independently execute curves and channel-level color balance.","concept":"Curves independently remaps each channel, enabling contrast and color correction. Multiple anchored points let you preserve some values while changing others; aggressive curves can posterize smooth tones.","location":"Layer > New Adjustment Layer > Curves; Window > Properties","steps":["Open a colorful practice image and add Curves adjustment.","Place two anchors around quarter and three-quarter tones, build a gentle S curve.","Choose Red channel and lift the midtone slightly; observe warmth shift.","Undo color move, then compare composite RGB and single-channel results."],"expected":"S curve boosts perceived midtone contrast; red-channel lift warms affected regions.","why":"Per-channel mappings alter color balance because RGB outputs no longer change identically.","practice":"Fix a deliberately cool image with an adjustable channel curve.","proof":"Neutral grays remain nearly neutral while overall color becomes more plausible.","mistake":"Large single-channel edits may tint intended neutrals.","tip":"Use multiple anchor points to protect highlights and shadows.","question":"Which Curves channel changes red without directly modifying green mapping?","answers":["RGB composite","Luminosity only","Red"],"correct":2,"explanation":"Per-channel mappings alter color balance because RGB outputs no longer change identically.","use":"Use Curves for selective contrast and neutral color corrections that require channel-level precision.","prerequisites":["s08l01"],"next":"s08l03","previous":"s08l01","connections":["s08l03","s07l03"],"completion":["Neutral grays remain nearly neutral while overall color becomes more plausible.","Explain the underlying mechanism in your own words: Per-channel mappings alter color balance because RGB outputs no longer change identically."]},{"id":"s08l03","stage":8,"title":"White balance, HSL and selective grading","objective":"Explain and independently execute white balance, hsl and selective grading.","concept":"White balance neutralizes lighting tint; HSL adjustments target hue families, saturation and luminance. Color grading is a deliberate creative look layered on a technically credible base.","location":"Layer > New Adjustment Layer > Color Balance; Layer > New Adjustment Layer > Hue/Saturation","steps":["Open practice/color-palette.png as a reference for stable colors.","Add Color Balance adjustment and inspect Midtones Cyan/Red changes; reset afterward.","Add Hue/Saturation adjustment; choose a named color range instead of Master.","Move Hue modestly and observe which swatches react."],"expected":"Selected color families change while some other colors remain comparatively steady.","why":"Channel weighting and hue classification are different control models.","practice":"Build a natural and a stylized grade using separate adjustment groups.","proof":"Both can be toggled independently without source loss.","mistake":"Strong saturation increases can clip output gamut and skin tones.","tip":"Use masks for global adjustments that contaminate unrelated areas.","question":"Which adjusts one color family without shifting all hues equally?","answers":["Crop","Targeted Hue/Saturation range","Image Size"],"correct":1,"explanation":"Channel weighting and hue classification are different control models.","use":"Use local color-family corrections to fix casts or build a reproducible creative grade.","prerequisites":["s08l02"],"next":"s08l04","previous":"s08l02","connections":["s08l04","s07l04"],"completion":["Both can be toggled independently without source loss.","Explain the underlying mechanism in your own words: Channel weighting and hue classification are different control models."]},{"id":"s08l04","stage":8,"title":"RAW development and Camera Raw Smart Objects","objective":"Explain and independently execute raw development and camera raw smart objects.","concept":"Camera Raw interprets sensor data and stores edits non-destructively; JPEG and TIFF can enter its tools but cannot recover data already discarded by camera processing. Open as Smart Object to preserve reopenable raw controls.","location":"File > Open (select a supported camera RAW file); Filter > Camera Raw Filter; Help > About Plug-In > Camera Raw","steps":["Open a supported owned camera RAW file via File > Open; review white balance and exposure in Camera Raw.","Hold Shift when the Open Image button offers Open Object (label varies by context) or use Camera Raw workflow options to open as Smart Object.","Double-click the Smart Object thumbnail in Layers to reopen Camera Raw settings.","For a non-RAW image converted to Smart Object, compare Filter > Camera Raw Filter."],"expected":"Raw Smart Object retains revisable develop settings; ordinary filter works on rendered pixels.","why":"RAW processing starts with sensor measurements, while Camera Raw Filter receives an already-rendered image.","practice":"Develop a RAW landscape in two separate mood versions.","proof":"Reopen a saved Smart Object and adjust white balance without re-importing.","mistake":"Camera RAW is not the same as Photoshop Raw file format.","tip":"Check supported camera models and Camera Raw plug-in version for new cameras.","question":"What is preserved by a RAW Smart Object?","answers":["Reopenable RAW development settings","Infinite sensor detail","An unchanged JPEG export"],"correct":0,"explanation":"RAW processing starts with sensor measurements, while Camera Raw Filter receives an already-rendered image.","use":"Use Camera Raw Smart Objects when exposure/white balance may need to be changed after the Photoshop composite is built.","prerequisites":["s08l03","s04l02"],"next":"s08l05","previous":"s08l03","connections":["s08l05","s07l05"],"completion":["Reopen a saved Smart Object and adjust white balance without re-importing.","Explain the underlying mechanism in your own words: RAW processing starts with sensor measurements, while Camera Raw Filter receives an already-rendered image."]},{"id":"s08l05","stage":8,"title":"RGB, CMYK, Lab, grayscale and bit depth","objective":"Explain and independently execute rgb, cmyk, lab, grayscale and bit depth.","concept":"Color mode defines channels; profiles interpret numbers; bit depth controls channel precision. RGB generally suits photo/screen editing, CMYK depends on print process, Lab separates perceptual lightness/chroma axes.","location":"Image > Mode; Edit > Convert to Profile; Edit > Color Settings","steps":["Duplicate a colorful PSD and inspect Image > Mode > RGB Color and 8 Bits/Channel.","Open Edit > Convert to Profile; inspect available destination spaces without committing at first.","Make a copy and try Image > Mode > Grayscale, noting the loss of color info.","Keep original RGB master untouched for comparison."],"expected":"Grayscale copy loses chromatic information; profile conversion affects numerical representation.","why":"The same numbers appear differently under different color interpretations.","practice":"Produce two named variants for display and grayscale proofing.","proof":"Original RGB file opens unchanged; profile choices documented.","mistake":"Assign Profile and Convert to Profile are not interchangeable.","tip":"Obtain printer-specific ICC guidance before committing to CMYK conversion.","question":"Which action preserves appearance better across profiles when performed correctly?","answers":["Blindly assign unrelated profile","Delete ICC metadata","Convert to Profile"],"correct":2,"explanation":"The same numbers appear differently under different color interpretations.","use":"Use mode, bit depth and ICC profile discipline to avoid color shifts between editing, export and print.","prerequisites":["s08l04"],"next":"s08l06","previous":"s08l04","connections":["s08l06","s07l06"],"completion":["Original RGB file opens unchanged; profile choices documented.","Explain the underlying mechanism in your own words: The same numbers appear differently under different color interpretations."]},{"id":"s08l06","stage":8,"title":"Soft proofing, gamut and print preparation","objective":"Explain and independently execute soft proofing, gamut and print preparation.","concept":"Soft proofing simulates an output profile on your monitor; gamut warnings are approximations, not a substitute for a calibrated display and printer proof. Print success depends on PPI, profile, paper and output sharpening.","location":"View > Proof Setup > Custom; View > Proof Colors; File > Print","steps":["Open a finished RGB image and make a duplicate.","Choose View > Proof Setup > Custom and select a real printer/paper ICC if supplied; otherwise use an available reference profile and label it a simulation.","Toggle View > Proof Colors.","Inspect Image Size print dimensions with Resample disabled and confirm document bleed requirements externally."],"expected":"Soft-proof appearance may change, but source pixels are not converted merely by toggling proof.","why":"Display color management models expected output gamut and tone behavior.","practice":"Make an annotated proofing checklist for a 6 × 4 inch print at 300 PPI.","proof":"Target output has at least 1800 × 1200 pixels without invented detail.","mistake":"Do not promise precise print color without paper, printer, ink and profile details.","tip":"Preserve the tagged RGB master and supply printer-requested format separately.","question":"Does View > Proof Colors permanently convert image pixels?","answers":["Only in PSD","No","Yes"],"correct":1,"explanation":"Display color management models expected output gamut and tone behavior.","use":"Use soft proofing before committing to an actual printer or narrow-gamut output destination.","prerequisites":["s08l05"],"next":"s08l07","previous":"s08l05","connections":["s08l07","s08l01"],"completion":["Target output has at least 1800 × 1200 pixels without invented detail.","Explain the underlying mechanism in your own words: Display color management models expected output gamut and tone behavior."]},{"id":"s08l07","stage":8,"title":"Sharpening, noise and HDR discipline","objective":"Explain and independently execute sharpening, noise and hdr discipline.","concept":"Sharpening boosts local contrast; it cannot truly reconstruct lost focus. Noise reduction trades grain against small detail. HDR 32-bit workflows have display and export restrictions, so test final targets.","location":"Filter > Sharpen > Smart Sharpen; Filter > Noise > Reduce Noise; Image > Mode","steps":["Duplicate a detailed photo or use practice/retouch-dots.png.","Convert duplicate to Smart Object; apply Filter > Sharpen > Smart Sharpen with a small Amount and Radius.","At 100%, compare halos around high-contrast lines; adjust downward.","Try a noise-reduction filter on a separate Smart Object and compare fine detail."],"expected":"Moderate sharpening clarifies edges; too much creates light/dark halos and artificial texture.","why":"Sharpening and denoising are competing spatial-frequency operations.","practice":"Create a before/after crop for web versus print sharpness.","proof":"Edges are enhanced but no visible bright halos or plastic texture appear.","mistake":"Never judge sharpening solely at Fit on Screen.","tip":"Do output sharpening only after final pixel dimensions are fixed.","question":"What does oversharpening commonly produce?","answers":["Bright/dark edge halos","Extra sensor information","Larger gamut"],"correct":0,"explanation":"Sharpening and denoising are competing spatial-frequency operations.","use":"Use controlled final-size sharpening and noise reduction in photographic delivery without introducing halos.","prerequisites":["s08l06"],"next":"s09l01","previous":"s08l06","connections":["s09l01","s08l02"],"completion":["Edges are enhanced but no visible bright halos or plastic texture appear.","Explain the underlying mechanism in your own words: Sharpening and denoising are competing spatial-frequency operations."]},{"id":"s09l01","stage":9,"title":"Composite planning: light, camera and scale","objective":"Explain and independently execute composite planning: light, camera and scale.","concept":"A convincing composite must agree in horizon, perspective, relative scale, direction of light, sharpness, noise and color. Solving camera geometry first avoids wasting time on effects.","location":"File > Place Embedded; Edit > Free Transform; View > Rulers","steps":["Create a background with a visible floor/horizon from simple shape layers.","Place an isolated PNG shape as a Smart Object.","Align its apparent base with the floor plane and scale it relative to a known reference.","Draw arrows on a separate planning layer showing camera horizon and light direction."],"expected":"Placed subject occupies a plausible plane with declared light and size assumptions.","why":"Visual plausibility emerges from consistency across several independent cues.","practice":"Assemble a three-object scene and write a one-sentence lighting plan.","proof":"All objects share coherent horizon and light direction.","mistake":"Matching colors cannot fix impossible perspective.","tip":"Plan in grayscale before refining saturation.","question":"What should be solved before elaborate grading?","answers":["Decorative texture","Export compression","Perspective and scale"],"correct":2,"explanation":"Visual plausibility emerges from consistency across several independent cues.","use":"Use geometry and lighting planning to prevent believable individual assets from producing an implausible overall composite.","prerequisites":["s08l07","s03l03","s04l02","s08l02"],"next":"s09l02","previous":"s08l07","connections":["s09l02","s08l03"],"completion":["All objects share coherent horizon and light direction.","Explain the underlying mechanism in your own words: Visual plausibility emerges from consistency across several independent cues."]},{"id":"s09l02","stage":9,"title":"Realistic contact and cast shadows","objective":"Explain and independently execute realistic contact and cast shadows.","concept":"Contact shadows anchor objects where they touch a plane; cast shadows project away from a light source and typically soften with distance. A single black Gaussian Blur shadow rarely fits every scene.","location":"Layer > New > Layer; Edit > Transform; Filter > Blur > Gaussian Blur","steps":["Place an isolated object above a light floor layer.","Create a new shadow layer beneath it and paint a tight dark contact shape.","Draw a longer low-opacity cast silhouette, transform it along floor direction.","Convert shadow layer to Smart Object, blur slightly and reduce opacity."],"expected":"Object feels attached to the plane; shadow direction follows planned light.","why":"Light occlusion reduces illumination in geometrically consistent regions.","practice":"Produce two versions of same scene with different light directions.","proof":"Each shadow direction and softness matches its chosen light.","mistake":"Hard contact edges and distant shadow softness should not be identical.","tip":"Use separate contact and cast shadow layers for control.","question":"Which shadow anchors an object at its base?","answers":["Outer Glow","Contact shadow","Lens flare"],"correct":1,"explanation":"Light occlusion reduces illumination in geometrically consistent regions.","use":"Use separate contact/cast shadows for believable product insertions and ground-plane integration.","prerequisites":["s09l01","s04l03"],"next":"s09l03","previous":"s09l01","connections":["s09l03","s08l04"],"completion":["Each shadow direction and softness matches its chosen light.","Explain the underlying mechanism in your own words: Light occlusion reduces illumination in geometrically consistent regions."]},{"id":"s09l03","stage":9,"title":"Edge integration and local color matching","objective":"Explain and independently execute edge integration and local color matching.","concept":"Edge fringing, chromatic mismatch and inappropriate focus announce a cutout. Use subject masks, Curves, local color adjustments and selective blur/grain instead of one global filter.","location":"Select > Select and Mask; Layer > New Adjustment Layer > Curves","steps":["Place an isolated object above a contrasting background.","Inspect cutout at 100% on both dark and light backgrounds.","Refine layer mask edge, then clip a Curves adjustment to subject.","Match subject black/white points to scene and add subtle edge softening only where needed."],"expected":"Subject no longer carries a conspicuous fringe; tonal range aligns with background.","why":"Compositing succeeds when each edge reproduces the background transition expected by the viewer.","practice":"Insert a new cutout into two different scenes and refine each separately.","proof":"No obvious halo, incorrect sharpness or color boundary at actual viewing size.","mistake":"Global blur to hide a bad mask destroys subject detail.","tip":"Evaluate cutouts at both 100% and final output zoom.","question":"What is the most targeted way to fix subject-only tone?","answers":["Clipped Curves adjustment","Global Exposure adjustment","Change canvas size"],"correct":0,"explanation":"Compositing succeeds when each edge reproduces the background transition expected by the viewer.","use":"Use edge and color matching when a good cutout still looks pasted onto a different background.","prerequisites":["s09l02"],"next":"s09l04","previous":"s09l02","connections":["s09l04","s08l05"],"completion":["No obvious halo, incorrect sharpness or color boundary at actual viewing size.","Explain the underlying mechanism in your own words: Compositing succeeds when each edge reproduces the background transition expected by the viewer."]},{"id":"s09l04","stage":9,"title":"Depth, atmosphere and selective focus","objective":"Explain and independently execute depth, atmosphere and selective focus.","concept":"Distance tends to reduce contrast and sometimes shift hue toward atmospheric light; depth of field depends on camera focus and aperture. Apply effects by depth groups instead of blanket fog and blur.","location":"Layer masks; Filter > Blur > Gaussian Blur","steps":["Make a three-plane scene with foreground, midground and background shapes.","Convert background to Smart Object and apply mild Gaussian Blur.","Add a pale atmosphere layer, mask it to reveal mostly distant objects.","Compare layers with and without reductions in distant contrast."],"expected":"Far objects appear less contrasted and softer, while foreground retains detail.","why":"Scattering and focus cues help indicate distance.","practice":"Build three distinct depth bands and caption which cues create separation.","proof":"Foreground and distance read as different planes even at thumbnail size.","mistake":"Uniform blur makes the entire scene look out of focus.","tip":"Vary effect strength by depth masks and light sources.","question":"Which plane usually receives the strongest atmospheric haze?","answers":["Near focal subject","All equally","Far background"],"correct":2,"explanation":"Scattering and focus cues help indicate distance.","use":"Use depth cues and local atmosphere for layered landscapes, posters and concept art.","prerequisites":["s09l03"],"next":"s09l05","previous":"s09l03","connections":["s09l05","s08l06"],"completion":["Foreground and distance read as different planes even at thumbnail size.","Explain the underlying mechanism in your own words: Scattering and focus cues help indicate distance."]},{"id":"s09l05","stage":9,"title":"Displacement and realistic surface mockups","objective":"Explain and independently execute displacement and realistic surface mockups.","concept":"Displacement maps perturb coordinates using tonal data from a surface map; they help graphics inherit material folds or curvature. They do not automatically reproduce realistic surface shading.","location":"Filter > Distort > Displace; File > Save As","steps":["Create a grayscale texture and save it locally as a PSD displacement map.","Place a logo as a Smart Object over a textured base image.","Use Filter > Distort > Displace on a suitable raster or Smart Object layer, choose modest horizontal/vertical scale and select the map PSD.","Try Multiply or luminosity blending and mask unwanted areas."],"expected":"Logo geometry follows some surface undulations but remains visually readable.","why":"A map converts grayscale changes to positional offsets; shading must still be integrated.","practice":"Mock a graphic onto a wrinkled material and retain original flat logo.","proof":"The logo follows folds without severe tears or inconsistent shadows.","mistake":"Exaggerated displacement creates warped lettering and obvious artifact.","tip":"Start with small displacement values and keep the map at appropriate dimensions.","question":"What does a displacement map encode?","answers":["Printer profile","Geometric pixel offsets","Font licenses"],"correct":1,"explanation":"A map converts grayscale changes to positional offsets; shading must still be integrated.","use":"Use displacement maps where a graphic must conform to fabric, paper or architectural surfaces.","prerequisites":["s09l04","s04l02","s07l04"],"next":"s09l06","previous":"s09l04","connections":["s09l06","s08l07"],"completion":["The logo follows folds without severe tears or inconsistent shadows.","Explain the underlying mechanism in your own words: A map converts grayscale changes to positional offsets; shading must still be integrated."]},{"id":"s09l06","stage":9,"title":"Frequency separation and advanced retouch judgement","objective":"Explain and independently execute frequency separation and advanced retouch judgement.","concept":"Frequency separation places broad color/tone and fine texture on different layers. It can be powerful but introduces halos, plastic skin and workflow overhead if used automatically. Start with local healing and dodge/burn instead.","location":"Filter > Blur > Gaussian Blur; Image > Apply Image (advanced)","steps":["Duplicate an owned test image twice and name layers low frequency and high frequency.","Blur the low frequency layer only enough to reduce fine texture.","Study Image > Apply Image options and channel/bit-depth dependence before computing high frequency; avoid assuming one formula fits every document.","Compare with an ordinary healing/dodge-burn edit and keep the result that retains texture."],"expected":"A properly constructed pair can reproduce the source when combined; careless settings change tone.","why":"Spatial frequencies describe detail scale, not separate physical layers in the photographed subject.","practice":"Document a before/after explaining why frequency separation was or was not necessary.","proof":"No plastic texture, halos or color bleeding around boundaries.","mistake":"Do not use unverified one-click Apply Image formulas across 8/16/32-bit modes.","tip":"Begin with a reversible duplicate and validate reconstruction before retouching.","question":"Is frequency separation always the preferred portrait workflow?","answers":["No","Yes","Only for CMYK"],"correct":0,"explanation":"Spatial frequencies describe detail scale, not separate physical layers in the photographed subject.","use":"Use frequency separation only where a precise diagnosis justifies separating texture from broad tonal changes.","prerequisites":["s09l05","s05l04","s08l05"],"next":"s09l07","previous":"s09l05","connections":["s09l07","s09l01"],"completion":["No plastic texture, halos or color bleeding around boundaries.","Explain the underlying mechanism in your own words: Spatial frequencies describe detail scale, not separate physical layers in the photographed subject."]},{"id":"s09l07","stage":9,"title":"Blend layers into a high-quality final composite","objective":"Explain and independently execute blend layers into a high-quality final composite.","concept":"Final compositing integrates shadows, local grading, common grain, edge quality, proofing and delivery. A unified adjustment can help, but it must not conceal unresolved geometry.","location":"Layer > New Adjustment Layer > Curves; File > Export > Export As","steps":["Open a composite with at least three independent layer groups.","Inspect perspective and masks at 100% before final grading.","Create a restrained top-level Curves grade, optionally add controlled texture on a separate layer.","Export PNG/JPEG and compare at final viewing size with the PSD version."],"expected":"Exported scene looks coherent at both actual pixels and reduced size.","why":"Final cohesion combines local corrections with global rendering consistency.","practice":"Deliver an 1800 × 1200 scene with editable object groups and a flattened proof.","proof":"No obvious clipped mask, unsupported shadow, missing source or accidental crop.","mistake":"A global color overlay cannot repair incorrect edges or scale.","tip":"Use a final visual checklist and preserve source groups.","question":"Which is the final quality standard?","answers":["Maximum filter count","Smallest PSD possible","Cohesion at actual output size"],"correct":2,"explanation":"Final cohesion combines local corrections with global rendering consistency.","use":"Use systematic final review to catch compositing defects that global color grading alone cannot fix.","prerequisites":["s09l06"],"next":"s10l01","previous":"s09l06","connections":["s10l01","s09l02"],"completion":["No obvious clipped mask, unsupported shadow, missing source or accidental crop.","Explain the underlying mechanism in your own words: Final cohesion combines local corrections with global rendering consistency."]},{"id":"s10l01","stage":10,"title":"Folder structure, asset naming and linked delivery","objective":"Explain and independently execute folder structure, asset naming and linked delivery.","concept":"A professional source package must retain original assets, rights notes, working PSDs, exports, and versioned revisions. File dependencies should survive a transfer to another Windows machine.","location":"File > Place Linked; File > Save As","steps":["Create folders source, work, exports and references in Windows File Explorer.","Place a linked local PNG from source into a new PSD.","Save PSD into work and export a PNG into exports.","Copy the entire project folder to a new location and open the PSD from there; relink if required.","After saving the PSD, inspect File > Package as Adobe’s built-in option to gather linked source assets, and verify packaged files before handoff."],"expected":"PSD opens with complete visual content and exports are clearly separated.","why":"An editable document is only portable if dependencies and metadata travel with it.","practice":"Prepare a folder that another editor can inspect without a verbal explanation.","proof":"Every linked file exists and file names indicate purpose.","mistake":"Absolute or changed link paths can break when folders move.","tip":"Bundle linked source files and avoid arbitrary names like final_FINAL2.","question":"Where should immutable original inputs live?","answers":["temporary cache","source folder","exports folder only"],"correct":1,"explanation":"An editable document is only portable if dependencies and metadata travel with it.","use":"Use predictable source/work/export folders and packaging for revisable files transferred across computers.","prerequisites":["s09l07"],"next":"s10l02","previous":"s09l07","connections":["s10l02","s09l03"],"completion":["Every linked file exists and file names indicate purpose.","Explain the underlying mechanism in your own words: An editable document is only portable if dependencies and metadata travel with it."]},{"id":"s10l02","stage":10,"title":"Actions and batch processing","objective":"Explain and independently execute actions and batch processing.","concept":"Actions record repeatable UI operations; Batch applies them to many files. Their reliability depends on dialogs, file assumptions and target naming. Start with a small test set.","location":"Window > Actions; File > Automate > Batch","steps":["Make three copies of practice/color-palette.png in a temporary folder.","Open Window > Actions, create an action and record a safe resize or adjustment on an opened copy.","Stop recording and test action on one different copy.","Choose File > Automate > Batch and point Source/Destination to separate folders; inspect output before scaling up."],"expected":"Consistent edits appear in multiple outputs without changing source files.","why":"Automation replays a recorded sequence with limited contextual reasoning.","practice":"Batch-process three small files into a different output directory.","proof":"All three have intended dimensions, unique names and originals remain untouched.","mistake":"Recording Save As with absolute paths can cause overwrites.","tip":"Test one file, then three, before processing hundreds.","question":"What should happen before a large batch run?","answers":["Test small dataset","Delete masters","Assume every image identical"],"correct":0,"explanation":"Automation replays a recorded sequence with limited contextual reasoning.","use":"Use Actions and Batch for repeated, tested production tasks with strict output naming safeguards.","prerequisites":["s10l01","s01l03","s02l01"],"next":"s10l03","previous":"s10l01","connections":["s10l03","s09l04"],"completion":["All three have intended dimensions, unique names and originals remain untouched.","Explain the underlying mechanism in your own words: Automation replays a recorded sequence with limited contextual reasoning."]},{"id":"s10l03","stage":10,"title":"Templates and Smart Object replacement","objective":"Explain and independently execute templates and smart object replacement.","concept":"Templates encode stable geometry and interchangeable content. Linked or embedded Smart Objects let designers update a logo or photo without rebuilding layout every time.","location":"Layer > Smart Objects > Replace Contents; File > Place Embedded","steps":["Make a product card with a logo Smart Object and editable title layer.","Duplicate the entire PSD as a variant.","Right-click logo Smart Object and choose Replace Contents (or Layer > Smart Objects > Replace Contents).","Pick another same-aspect-ratio PNG and adjust its transform only if required."],"expected":"Replacement updates the artwork within the preserved layout.","why":"A Smart Object container separates content from scene transformations and effects.","practice":"Produce three branded variations from one saved master.","proof":"All maintain margins, text hierarchy and shadow style.","mistake":"Replacement assets with different aspect ratios may fit unpredictably.","tip":"Use standardized asset boxes and document expected proportions.","question":"What changes when replacing Smart Object contents?","answers":["All Photoshop preferences","Document mode automatically","Its source artwork"],"correct":2,"explanation":"A Smart Object container separates content from scene transformations and effects.","use":"Use Smart Object replacement to generate dozens of consistent visual mockup variants.","prerequisites":["s10l02"],"next":"s10l04","previous":"s10l02","connections":["s10l04","s09l05"],"completion":["All maintain margins, text hierarchy and shadow style.","Explain the underlying mechanism in your own words: A Smart Object container separates content from scene transformations and effects."]},{"id":"s10l04","stage":10,"title":"Scripting and supported extensibility boundaries","objective":"Explain and independently execute scripting and supported extensibility boundaries.","concept":"Actions are built-in; scripting and plugins can automate richer operations but require compatibility checks. UXP is a modern Photoshop extensibility system; legacy script examples may rely on different APIs.","location":"File > Scripts; Plugins menu (when installed)","steps":["Open File > Scripts and inspect available built-in commands.","Record a simple Action as a baseline no-code solution.","Review a script only from a trusted local source and determine required Photoshop API/version.","Run scripts on copies, inspect output, and check logs if they fail."],"expected":"Built-in scripts appear where installed; no third-party tool is needed for the core lessons.","why":"Automation code is versioned software and must be treated as a dependency.","practice":"Write an automation plan identifying which operations need only Actions versus scripting.","proof":"Plan includes inputs, outputs, safe retries and test conditions.","mistake":"Do not blindly run untrusted JSX or UXP plugin code.","tip":"Prefer Actions for simple repeatable editing; Adobe UXP plug-ins and Photoshop scripting are different extension methods with distinct support and security constraints.","question":"Which is built into Photoshop without a plugin?","answers":["External cloud API","Actions panel","Any downloaded automation extension"],"correct":1,"explanation":"Automation code is versioned software and must be treated as a dependency.","use":"Use vetted scripts and plug-ins where a supported automation capability exceeds what Actions can reliably do.","prerequisites":["s10l03"],"next":"s10l05","previous":"s10l03","connections":["s10l05","s09l06"],"completion":["Plan includes inputs, outputs, safe retries and test conditions.","Explain the underlying mechanism in your own words: Automation code is versioned software and must be treated as a dependency."]},{"id":"s10l05","stage":10,"title":"Export As, Quick Export and format decisions","objective":"Explain and independently execute export as, quick export and format decisions.","concept":"Export is a delivery transformation, not a working-file save. PNG supports transparent graphics; JPEG is lossy and opaque; formats such as WebP depend on receiving system support and export options.","location":"File > Export > Export As; File > Export > Quick Export (output format follows Export preferences)","steps":["Create a 1080 × 1080 design with text and a transparent margin.","Use File > Export > Export As; compare PNG and JPEG available settings.","Export one PNG with transparency and one JPEG at an appropriate quality.","Reopen both on a contrasting background and inspect size and edge behavior."],"expected":"PNG preserves transparency; JPEG may show compression and fills transparent areas.","why":"Different encoders trade alpha, size and artifact behavior.","practice":"Deliver one social banner as JPEG and one icon as transparent PNG.","proof":"Both fit exact requested dimensions and display correctly in target viewer.","mistake":"Do not rely on a flattened PNG to restore text editability.","tip":"Always inspect exported assets, not only the PSD.","question":"Which output is suited to transparent logos?","answers":["PNG","JPEG","Flattened RGB-only BMP"],"correct":0,"explanation":"Different encoders trade alpha, size and artifact behavior.","use":"Use format-appropriate export when exact transparency, dimensions and compression are delivery requirements.","prerequisites":["s10l04","s02l04","s08l05"],"next":"s10l06","previous":"s10l04","connections":["s10l06","s09l07"],"completion":["Both fit exact requested dimensions and display correctly in target viewer.","Explain the underlying mechanism in your own words: Different encoders trade alpha, size and artifact behavior."]},{"id":"s10l06","stage":10,"title":"Print, preflight and external application handoffs","objective":"Explain and independently execute print, preflight and external application handoffs.","concept":"Print preflight covers dimensions, bleed, safe area, ICC conversion and fonts; cross-app delivery requires knowing what stays editable. Illustrator paths and Lightroom develop adjustments are not identical to Photoshop layers.","location":"Image > Image Size; Edit > Convert to Profile; File > Print","steps":["Open a print-sized PSD and check pixel dimensions with Image > Image Size.","Inspect type layers for missing fonts and links for absent assets.","Use View > Proof Setup > Custom if the print profile is supplied.","Save a versioned master plus a printer-requested delivery copy; communicate bleed/trimming externally."],"expected":"You have a clean production file and explicit unresolved printer requirements.","why":"Production constraints come from a destination system, not one universal print preset.","practice":"Prepare a 5 × 7 inch poster briefing with print specification checklist.","proof":"Required profile, bleed, stock and export format are explicitly listed as confirmed or TBD.","mistake":"There is no universally correct CMYK profile for every printer.","tip":"Use the destination printer’s specification rather than generic recipes.","question":"Before converting to CMYK, what is needed?","answers":["A random profile","Only a JPEG filename","Destination print conditions/profile"],"correct":2,"explanation":"Production constraints come from a destination system, not one universal print preset.","use":"Use preflight checklists when delivering for a particular print shop or handoff application.","prerequisites":["s10l05"],"next":"s11l01","previous":"s10l05","connections":["s11l01","s10l01"],"completion":["Required profile, bleed, stock and export format are explicitly listed as confirmed or TBD.","Explain the underlying mechanism in your own words: Production constraints come from a destination system, not one universal print preset."]},{"id":"s11l01","stage":11,"title":"GPU, memory and scratch disk triage","objective":"Explain and independently execute gpu, memory and scratch disk triage.","concept":"Photoshop uses CPU, RAM, GPU and scratch disk for different tasks. Low scratch space, incompatible drivers or an unsupported GPU can cause lag, missing features and crashes.","location":"Edit > Preferences > Performance; Edit > Preferences > Scratch Disks","steps":["Open Edit > Preferences > Performance and note Memory Usage and detected GPU.","Confirm the intended scratch disk has substantial free space in Windows File Explorer.","Check Edit > Preferences > Scratch Disks for active locations; do not change them blindly.","Save your file and run one operation that previously lagged while monitoring system load."],"expected":"You can identify whether memory, scratch space or GPU availability is an obvious bottleneck.","why":"Photoshop spills work to disk when memory is inadequate; GPU functions require compatible capability.","practice":"Make a system inventory with RAM, free scratch space, GPU and driver version.","proof":"Inventory identifies at least two potential bottlenecks if present.","mistake":"Never clear unknown scratch files while Photoshop is running.","tip":"Prefer internal fast SSD scratch space and tested graphics drivers.","question":"What resource handles spillover when RAM is insufficient?","answers":["ICC profile","Scratch disk","Font manager"],"correct":1,"explanation":"Photoshop spills work to disk when memory is inadequate; GPU functions require compatible capability.","use":"Use performance diagnostics before changing Photoshop preferences or deleting scratch data.","prerequisites":["s10l06"],"next":"s11l02","previous":"s10l06","connections":["s11l02","s10l02"],"completion":["Inventory identifies at least two potential bottlenecks if present.","Explain the underlying mechanism in your own words: Photoshop spills work to disk when memory is inadequate; GPU functions require compatible capability."]},{"id":"s11l02","stage":11,"title":"Windows VM graphics and feature limitations","objective":"Explain and independently execute windows vm graphics and feature limitations.","concept":"A Windows guest needs virtualized DirectX feature support and real GPU capabilities; a Linux host GPU does not automatically become available to Photoshop inside the VM. Official Photoshop system requirements apply to the guest, but hypervisor support varies.","location":"Edit > Preferences > Performance; Help > System Info","steps":["Inside the Windows guest, open Help > System Info and record GPU/driver details.","Check Windows Device Manager > Display adapters for guest-presented hardware.","Open Photoshop Performance preferences and verify whether Use Graphics Processor can be selected.","If unsupported, test basic 2D workflows and compare with GPU-dependent ones without assuming pass-through works."],"expected":"The guest’s actual graphics capability is documented and feature gaps are identified.","why":"Virtual GPUs expose only their emulated or passed-through capabilities to the guest OS.","practice":"Create a VM compatibility report with Windows version, vRAM, DirectX level and Photoshop GPU status.","proof":"Report distinguishes Adobe minimums from practical VM observations.","mistake":"Do not claim PCIe passthrough or hardware acceleration exists because the host GPU is powerful.","tip":"Use native Windows hardware when GPU-heavy features are essential and virtualization cannot satisfy them.","question":"What GPU matters to Photoshop in a VM?","answers":["GPU capability exposed to guest","Host specification alone","Linux desktop theme"],"correct":0,"explanation":"Virtual GPUs expose only their emulated or passed-through capabilities to the guest OS.","use":"Use guest-visible GPU diagnostics before deciding if a Windows VM is suitable for GPU-dependent Photoshop work.","prerequisites":["s11l01"],"next":"s11l03","previous":"s11l01","connections":["s11l03","s10l03"],"completion":["Report distinguishes Adobe minimums from practical VM observations.","Explain the underlying mechanism in your own words: Virtual GPUs expose only their emulated or passed-through capabilities to the guest OS."]},{"id":"s11l03","stage":11,"title":"Crashes, resets and safe diagnostics","objective":"Explain and independently execute crashes, resets and safe diagnostics.","concept":"Crashes can arise from drivers, plugins, fonts, corrupt preferences, scratch exhaustion or damaged documents. Isolate variables before resetting preferences or reinstalling.","location":"Help > System Info; Edit > Preferences > General","steps":["Save a separate backup and record the exact crash action.","Note installed Photoshop version via Help > About Photoshop and GPU information via Help > System Info.","Test with nonessential third-party plugins disabled and a small new document.","Only after preserving settings, use documented Reset Preferences on Quit and restart if indicated."],"expected":"A reproducible trigger or narrowed category is recorded rather than guessed.","why":"Controlled experiments change one variable at a time.","practice":"Write a troubleshooting incident log with symptoms, versions and 3 discriminating tests.","proof":"Another person could reproduce or eliminate the fault systematically.","mistake":"Resetting preferences may discard custom settings, presets and workspace changes.","tip":"Export/back up preferences and presets first.","question":"What is the first good response to repeated crashes?","answers":["Randomly delete files","Flatten every PSD","Record reproducible trigger and configuration"],"correct":2,"explanation":"Controlled experiments change one variable at a time.","use":"Use controlled, reversible troubleshooting before resetting preferences or blaming document corruption.","prerequisites":["s11l02"],"next":"s11l04","previous":"s11l02","connections":["s11l04","s10l04"],"completion":["Another person could reproduce or eliminate the fault systematically.","Explain the underlying mechanism in your own words: Controlled experiments change one variable at a time."]},{"id":"s11l04","stage":11,"title":"Missing fonts, links, color shifts and corruption","objective":"Explain and independently execute missing fonts, links, color shifts and corruption.","concept":"Broken links and missing fonts change composition. Color shifts arise from unmanaged viewers, missing embedded profiles and proof settings. Corrupt documents require backups rather than optimistic destructive repairs.","location":"Window > Layers; Edit > Color Settings; File > Open","steps":["Open a PSD with linked content and inspect link warning icons.","Review text layers for missing fonts and compare a rendered preview with live text.","Check whether image has an embedded profile and inspect color settings; compare in a color-managed viewer.","Save a fresh copy before any relink or font replacement."],"expected":"You can separate missing-dependency issues from profile/display differences.","why":"Documents encode assets, text layout and color interpretation that depend on environment.","practice":"Produce a dependency checklist for a client PSD and verify linked assets.","proof":"No silent font substitution or missing photo remains at final export.","mistake":"Assigning a random ICC profile to fix a color mismatch can worsen it.","tip":"Investigate embed/convert/viewer before changing pixel colors.","question":"Which can cause text to reflow on another PC?","answers":["Larger mouse cursor","Missing font","More scratch space"],"correct":1,"explanation":"Documents encode assets, text layout and color interpretation that depend on environment.","use":"Use missing-font/link/profile checks before editing source pixels to fix a delivery mismatch.","prerequisites":["s11l03"],"next":"s11l05","previous":"s11l03","connections":["s11l05","s10l05"],"completion":["No silent font substitution or missing photo remains at final export.","Explain the underlying mechanism in your own words: Documents encode assets, text layout and color interpretation that depend on environment."]},{"id":"s11l05","stage":11,"title":"Large files, cache levels and robust recovery","objective":"Explain and independently execute large files, cache levels and robust recovery.","concept":"Large PSDs may need PSB; cache levels influence preview performance, and recovery copies are not guaranteed. Separate working copies and periodic verified backups are essential.","location":"Edit > Preferences > Performance; File > Save As","steps":["Duplicate a multi-layer PSD and record its file size.","Inspect History & Cache settings in Performance without guessing ideal values.","If a document exceeds PSD format limits, choose PSB when saving and confirm receiving tools accept PSB.","Save versioned files to a backed-up drive and test reopening the most recent revision."],"expected":"There is at least one recoverable editable copy separate from the active working file.","why":"Recovery depends on valid stored content, not merely auto-recovery preferences.","practice":"Design a 3-2-1-inspired backup plan for working PSDs and source assets.","proof":"Test restores at least one file and specifies storage locations.","mistake":"Do not assume auto-recovery is a full versioning/backup system.","tip":"Verify a backup by opening it, not just checking file existence.","question":"What is PSB intended for?","answers":["Large Photoshop documents","Compressed web thumbnails","Vector font installation"],"correct":0,"explanation":"Recovery depends on valid stored content, not merely auto-recovery preferences.","use":"Use PSB, versioned saves and reopening tests for very large, long-lived layered productions.","prerequisites":["s11l04"],"next":"s11l06","previous":"s11l04","connections":["s11l06","s10l06"],"completion":["Test restores at least one file and specifies storage locations.","Explain the underlying mechanism in your own words: Recovery depends on valid stored content, not merely auto-recovery preferences."]},{"id":"s11l06","stage":11,"title":"Offline, account and AI availability","objective":"Explain and independently execute offline, account and ai availability.","concept":"The manual is offline. Photoshop activation and subscription validation may require internet, and Adobe generative services can use cloud processing and credits. Some recent Remove Tool AI processing may use a locally downloaded model on supported hardware.","location":"Help > About Photoshop; Edit > Preferences > Performance; Creative Cloud desktop account/subscription information","steps":["Inspect the account status and known online requirements before a disconnected session.","For a local editing trial, use non-AI tools such as layers, masks, Clone Stamp and Curves.","If Remove Tool offers on-device versus cloud model options, note required download and hardware availability.","Keep manual files on both Linux and Windows; export website progress as JSON between machines."],"expected":"You can distinguish editing that works locally from account- and network-dependent operations.","why":"Offline reference availability does not imply every Photoshop feature is offline.","practice":"Create a two-column inventory of offline core editing and online-dependent services.","proof":"Each listed feature has a specific dependency rather than vague AI label.","mistake":"Do not confuse newly introduced Beta AI Assisted Editor with stable tool behavior.","tip":"Check credits and terms inside the live Adobe account for actual entitlement.","question":"Does a fully offline manual guarantee offline Generative Fill?","answers":["Yes","Only on Linux","No"],"correct":2,"explanation":"Offline reference availability does not imply every Photoshop feature is offline.","use":"Use a dependency inventory before planning a disconnected editing session or relying on model-based AI tools.","prerequisites":["s11l05"],"next":"s12l01","previous":"s11l05","connections":["s12l01","s11l01"],"completion":["Each listed feature has a specific dependency rather than vague AI label.","Explain the underlying mechanism in your own words: Offline reference availability does not imply every Photoshop feature is offline."]},{"id":"s12l01","stage":12,"title":"Portrait retouching capstone","objective":"Explain and independently execute portrait retouching capstone.","concept":"Combine source preservation, selective healing, tonal dodge/burn, skin-texture protection and delivery review. Quality is judged against a plausible untouched reference.","location":"Healing Brush; Curves adjustment layers; File > Export > Export As","steps":["Choose an owned portrait and save a versioned PSD master.","Create cleanup layers for temporary defects and separate Dodge/Burn Curves masks.","Correct tone while preserving subject identity and texture.","Deliver a full-resolution JPEG and a two-panel before/after preview."],"expected":"Portrait looks more polished but still natural under close inspection.","why":"Local changes with editable layers are easier to audit and reverse.","practice":"Produce a final portrait and written edit log identifying each intervention.","proof":"At 100% pores and facial texture remain; no obvious healing repetition.","mistake":"Over-retouching is not professional finish.","tip":"Judge both 100% details and full-face expression.","question":"What is the main capstone standard?","answers":["Maximal symmetry","Natural, reversible improvement","Zero remaining texture"],"correct":1,"explanation":"Local changes with editable layers are easier to audit and reverse.","use":"Use a controlled portrait capstone to demonstrate texture preservation, layer hygiene and readable before/after evidence.","prerequisites":["s11l06"],"next":"s12l02","previous":"s11l06","connections":["s12l02","s11l02"],"completion":["At 100% pores and facial texture remain; no obvious healing repetition.","Explain the underlying mechanism in your own words: Local changes with editable layers are easier to audit and reverse."]},{"id":"s12l02","stage":12,"title":"Photo restoration capstone","objective":"Explain and independently execute photo restoration capstone.","concept":"Repair a damaged photo while separating evidenced recovery from imaginative reconstruction. A versioned archive and change log are part of technical quality.","location":"Clone Stamp; Spot Healing; Levels; Layers","steps":["Scan or choose owned restoration material; keep immutable original.","Create separate tone and damage repair groups.","Use local cloning/healing with frequent resampling; label missing-content reconstruction as interpreted.","Deliver layered PSD and a contact sheet showing stages."],"expected":"Damage is reduced without fabricating unmarked historical certainty.","why":"Transparent restoration records what is known and what is inferred.","practice":"Restore five distinct damaged regions with an edit log.","proof":"Original can be retrieved, and repaired areas remain individually reviewable.","mistake":"Never overwrite the archival scan.","tip":"Compare before/after at consistent scale and color-management settings.","question":"Why record speculative reconstruction?","answers":["It is not recoverable evidence","It guarantees historical accuracy","It reduces PSD size"],"correct":0,"explanation":"Transparent restoration records what is known and what is inferred.","use":"Use restoration deliverables to show an honest separation between documented recovery and interpreted detail.","prerequisites":["s12l01"],"next":"s12l03","previous":"s12l01","connections":["s12l03","s11l03"],"completion":["Original can be retrieved, and repaired areas remain individually reviewable.","Explain the underlying mechanism in your own words: Transparent restoration records what is known and what is inferred."]},{"id":"s12l03","stage":12,"title":"Product advertisement capstone","objective":"Explain and independently execute product advertisement capstone.","concept":"Product graphics combine extraction, contact shadows, controlled highlights, typography, color consistency and platform-specific output. Revision flexibility is part of the deliverable.","location":"Select > Select and Mask; Layer Styles; Type Tool; File > Export > Export As","steps":["Place an owned product photo over an editable background.","Refine mask, build contact and cast shadows on separate layers.","Add headline, offer and disclaimer text with hierarchy and safe margins.","Deliver a 1080 × 1350 JPEG and a transparent product PNG plus layered PSD."],"expected":"Product is believable and both outputs have the requested dimensions.","why":"Good advertising composition coordinates geometry, light and information.","practice":"Make a product promo using no paid stock and no flattened working master.","proof":"Clear subject silhouette, readable text, no clipped shadows at crop edges.","mistake":"Do not make unsupported factual product claims in promotional text.","tip":"Inspect type on a typical mobile-sized preview.","question":"Which PSD organization best supports revisions?","answers":["One merged image","Only smart filters","Separate product, shadows, text and background"],"correct":2,"explanation":"Good advertising composition coordinates geometry, light and information.","use":"Use a product campaign to integrate masks, shadows, typography and export requirements in one brief.","prerequisites":["s12l02"],"next":"s12l04","previous":"s12l02","connections":["s12l04","s11l04"],"completion":["Clear subject silhouette, readable text, no clipped shadows at crop edges.","Explain the underlying mechanism in your own words: Good advertising composition coordinates geometry, light and information."]},{"id":"s12l04","stage":12,"title":"Advanced scene-composite capstone","objective":"Explain and independently execute advanced scene-composite capstone.","concept":"Build a multi-source environment through geometry, lighting and edge integration. The rubric prioritizes perceptual consistency over effect novelty.","location":"File > Place Embedded; Select and Mask; Curves; Smart Filters","steps":["Make a scene from at least three independently editable visual assets.","Set a common horizon and one key-light direction.","Integrate each subject with a mask, contact shadow and clipped color correction.","Apply a restrained common grade and export 1800 × 1200 at final quality."],"expected":"Scene reads as one environment, with believable scale and lighting.","why":"Plausibility is the sum of independent visual consistency tests.","practice":"Deliver source/PSD/export folders and note all source provenance.","proof":"At 100%, no major halos, contradicted light, floating objects or repeated cloned texture.","mistake":"Do not use color grading to hide incorrect perspective.","tip":"Turn layers on/off during review to isolate mismatches.","question":"What should be audited before final grade?","answers":["Font family count","Scale, masks and light","File compression only"],"correct":1,"explanation":"Plausibility is the sum of independent visual consistency tests.","use":"Use a scene composite to prove camera, scale, mask, depth and light integration under final-size scrutiny.","prerequisites":["s12l03"],"next":"s12l05","previous":"s12l03","connections":["s12l05","s11l05"],"completion":["At 100%, no major halos, contradicted light, floating objects or repeated cloned texture.","Explain the underlying mechanism in your own words: Plausibility is the sum of independent visual consistency tests."]},{"id":"s12l05","stage":12,"title":"Reusable campaign design capstone","objective":"Explain and independently execute reusable campaign design capstone.","concept":"Campaign work demands one coherent design system across formats, predictable text reflow, Smart Object replacement and accurate exports. Production readiness is as important as beauty.","location":"File > Place Embedded; Window > Character; Actions; File > Export > Export As","steps":["Create one master design with groups for brand, image, text and background.","Adapt a square 1080 × 1080 version and a vertical 1080 × 1920 version as separate PSD variants.","Replace one Smart Object asset and adjust text safe areas.","Export both and inspect for accidental cropping and legibility."],"expected":"Two formats share clear visual identity with correct safe zones.","why":"A design system expresses stable rules while permitting composition changes.","practice":"Deliver two sizes, master PSD and a short update guide.","proof":"Both are legible and editable with consistent typography.","mistake":"Simply scaling the whole square often crops text in vertical output.","tip":"Design responsive compositions rather than blind resizes.","question":"What should remain stable across campaign formats?","answers":["Design rules, not pixel coordinates","Absolute text position","Every crop box"],"correct":0,"explanation":"A design system expresses stable rules while permitting composition changes.","use":"Use a multi-format campaign to demonstrate portable assets and responsive design rather than blind scaling.","prerequisites":["s12l04"],"next":"s12l06","previous":"s12l04","connections":["s12l06","s11l06"],"completion":["Both are legible and editable with consistent typography.","Explain the underlying mechanism in your own words: A design system expresses stable rules while permitting composition changes."]},{"id":"s12l06","stage":12,"title":"Final assessment: end-to-end editable project","objective":"Explain and independently execute final assessment: end-to-end editable project.","concept":"An expert-ready project proves fundamentals, compositing, retouching, typography, color, automation, output and technical handoff in one traceable artifact. Demonstrate decisions as well as mouse actions.","location":"All previously studied menus and panels","steps":["Choose a real brief: a three-format campaign built around a retouched original image.","Create an intact source archive and layered PSD with named adjustment, masking and typography groups.","Build one composite/mockup and automate at least one repeatable export or adjustment across three files.","Preflight exports for PNG transparency, JPEG dimensions, color profile, readability and expected recipient needs.","Write a one-page decision log and deliver all variants in a transferable folder."],"expected":"Every output matches the brief and remains explainable and revisable.","why":"Mastery is tested by controlled tradeoffs, diagnostic skill and reproducible delivery.","practice":"Complete the entire project without relying on paid stock, plugins or Generative Fill.","proof":"Rubric: 20% preservation/structure; 20% masks/composite; 20% tonal/color; 15% typography/layout; 15% delivery; 10% documentation. Target ≥85% with no critical failure.","mistake":"An attractive JPEG alone does not prove professional Photoshop competence.","tip":"Peer-review the layered PSD, not just exported appearance.","question":"Which evidence best demonstrates complete mastery?","answers":["Only one attractive thumbnail","Shortcut memorization alone","Editable project, verified outputs and decision log"],"correct":2,"explanation":"Mastery is tested by controlled tradeoffs, diagnostic skill and reproducible delivery.","use":"Use the final assignment as a repeatable evidence-based professional workflow from original files to checked handoff.","prerequisites":["s12l05","s09l07","s10l02","s10l05","s11l05"],"next":null,"previous":"s12l05","connections":["s12l01"],"completion":["Rubric: 20% preservation/structure; 20% masks/composite; 20% tonal/color; 15% typography/layout; 15% delivery; 10% documentation. Target ≥85% with no critical failure.","Explain the underlying mechanism in your own words: Mastery is tested by controlled tradeoffs, diagnostic skill and reproducible delivery."]}],"tools":[{"title":"Move","family":"Arrange","shortcut":"V","purpose":"Moves selected layers or selections; can auto-select under configured options.","controls":"Auto-Select; Show Transform Controls; alignment","use":"Use with multiple selected layers for precise layouts.","caution":"Dragging a locked or wrong layer appears to do nothing.","lesson":"s02l03","id":"tool-move","location":"Toolbar > Move/Artboard tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"Artboard","family":"Arrange","shortcut":"V","purpose":"Creates multiple layout canvases in one file.","controls":"Preset dimensions; orientation; artboard properties","use":"Useful for multiple screen-size variants.","caution":"Artboards are not independent PSD files.","lesson":"s10l05","id":"tool-artboard","location":"Toolbar > Move/Artboard tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"Frame","family":"Arrange","shortcut":"K","purpose":"Creates image placeholder frames using shape boundaries.","controls":"Rectangular/elliptical frames; frame content fit","use":"Use for replacing photos inside layouts.","caution":"A frame is not a normal empty raster selection.","lesson":"s07l06","id":"tool-frame","location":"Toolbar > Frame tool group (expand th  family; inspect toolbar configuration"},{"title":"Clone Stamp","family":"Retouch","shortcut":"S","purpose":"Copies pixels from an Alt-clicked source.","controls":"Aligned; opacity; sample layers","use":"Use for repeatable structural repair.","caution":"Repeated sampling creates cloned patterns.","lesson":"s05l02","id":"tool-clone-stamp","location":"Toolbar > Stamp tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"Pattern Stamp","family":"Paint","shortcut":"S","purpose":"Paints a chosen repeating pattern.","controls":"Pattern; impressionist; scale","use":"Use for textures and surfaces.","caution":"Repetition becomes obvious at large scale.","lesson":"s06l04","id":"tool-pattern-stamp","location":"Toolbar > Stamp tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"History Brush","family":"History","shortcut":"Y","purpose":"Paints from a selected earlier history state.","controls":"History source; blending; brush options","use":"Use for selective temporary restoration.","caution":"Earlier states disappear after document closure.","lesson":"s06l05","id":"tool-history-brush","location":"Toolbar > History Brush tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"Art History Brush","family":"History","shortcut":"Y","purpose":"Stylizes painting based on a history state.","controls":"Style; Area; Tolerance","use":"Use for painterly variations.","caution":"Not a restoration tool for accurate pixels.","lesson":"s06l05","id":"tool-art-history-brush","location":"Toolbar > History Brush tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"Eraser","family":"Erase","shortcut":"E","purpose":"Deletes or reduces pixels or transparency.","controls":"Brush mode; opacity; ":"Zoom","family":"View","shortcut":"Z","purpose":"Changes on-screen magnification.","controls":"Scrubby Zoom; animated zoom support","use":"Use to assess at 100%.","caution":"Zoom cannot create real detail.","lesson":"s01l05","id":"tool-zoom","location":"Toolbar > Zoom tool group (expand the tool group; Edit > Toolbar if not visible)","status":"Tool family; inspect toolbar configuration"},{"title":"Adjustment Brush","family":"Local adjustments","shortcut":"B","purpose":"Paints the coverage of a non-destructive local adjustment while adjusting image tone or color.","controls":"Adjustment type; brush size; hardness; Add/Subtract; properties vary","use":"Make local reversible correction without manually creating the mask first.","caution":"Verify that the adjustment mask, not source pixels, is selected and account for the current Tool group.","lesson":"s04l01","location":"Toolbar > Brush/Adjustment Brush tool group (expand the tool group; Edit > Toolbar if not visible)","id":"tool-adjustment-brush","status":"Modern built-in tool; verify toolbar layout"}],"filters":[{"title":"Gaussian Blur","family":"Blur","controls":"Radius","effect":"Smooths pixels with Gaussian weighting; blur grows with radius.","use":"Soft backgrounds and feathered shadows","caution":"Loses fine detail if applied directly; Smart Filter normally available.","lesson":"s04l03","id":"filter-gaussian-blur","location":"Filter > Blur > Gaussian Blur","status":"Documented family; mode and GPU limits apply"},{"title":"Box Blur","family":"Blur","controls":"Radius","effect":"Averages colors within a rectangular neighborhood.","use":"Stylized flat smoothness","caution":"May create boxy edges at high radius.","lesson":"s08l07","id":"filter-box-blur","location":"Filter > Blur > Box Blur","status":"Documented family; mode and GPU limits apply"},{"title":"Average","family":"Blur","controls":"None","effect":"Replaces selected area with its average color.","use":"Determine or generate representative color","caution":"Removes all local detail.","lesson":"s06l03","id":"filter-average","location":"Filter > Blur > Average","status":"Documented family; mode and GPU limits apply"},{"title":"Blur","family":"Blur","controls":"Preset strength","effect":"Applies a mild blur.","use":"Tiny softening","caution":"Repeated destructive use stacks loss.","lesson":"s08l07","id":"filter-blur","location":"Filter > Blur > Blur","status":"Documented family; mode and GPU limits apply"},{"title":"Blur More","family":"Blur","controls":"Preset strength","effect":"Applies stronger standard blur.","use":"Quick broad softening","caution":"Less controllable than Gaussian Blur.","lesson":"s08l07","id":"filter-blur-more","location":"Filter > Blur > Blur More","status":"Documented family; mode and GPU limits apply"},{"title":"Motion Blur","family":"Blur","controls":"Angle; Distance","effect":"Blurs along a line, suggesting motion.","use":"Motion trails and effects","caution":"Wrong angle contradicts movement.","lesson":"s09l04","id":"filter-motion-blur","location":"Filter > Blur > Motion Blur","status":"Documented family; mode and GPU limits apply"},{"title":"Radial Blur","family":"Blur","controls":"Amount; Blur Method; Quality","effect":"Blurs outward or in rotation from a center.","use":"Speed or rotational effects","caution":"Center and quality need previewing.","lesson":"s09l04","id":"filter-radial-blur","location":"Filter > Blur > Radial Blur","status":"Documented family; mode and GPU limits apply"},{"title":"Lens Blur","family":"Blur","controls":"Blur amount; depth map; iris controls","effect":"Simulates defocus using depth information.","use":"Depth-of-field effects","caution":"Adobe lists 16/32-bit compatibility limits; check mode. Not available as an editable Smart Filter in Adobe’s Oct 2026 Smart Filter documentation.","lesson":"s09l04","id":"filter-lens-blur","location":"Filter > Blur > Lens Blur","status":"Documented family; mode and GPU limits apply"},{"title":"Smart Blur","family":"Blur","contr
