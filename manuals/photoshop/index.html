ow > Layers","steps":["Create a 600 × 400 px, RGB Color, 8-bit, white document.","Select Brush Tool (B), create a blank pixel layer, click once with a hard brush, then zoom to 400% to inspect the painted pixel edge.","Select Rectangle Tool in Shape mode, draw a rectangle, then zoom in.","Inspect the new shape layer and compare its editable edges with raster painting."],"expected":"A shape layer remains a separate editable object; painted pixels show discrete squares at high zoom.","why":"Raster images sample color at finite coordinates; vectors describe geometry independently of that grid.","practice":"Create one raster mark and one Shape layer, rename both and compare them at 800% zoom.","proof":"Explain which artwork tolerates repeated scaling and why.","mistake":"Do not confuse zooming the view with increasing real resolution.","tip":"Use Shape mode rather than Pixels mode when you want editable geometry.","question":"Which is resolution-independent before export?","answers":["A raster brushstroke","A vector path","A flattened JPEG"],"correct":1,"explanation":"Raster images sample color at finite coordinates; vectors describe geometry independently of that grid.","use":"Use this distinction when choosing Photoshop raster editing versus editable shape/type artwork for logos, graphics and photographs.","prerequisites":[],"next":"s01l02","previous":null,"connections":["s01l02"],"completion":["Explain which artwork tolerates repeated scaling and why.","Explain the underlying mechanism in your own words: Raster images sample color at finite coordinates; vectors describe geometry independently of that grid."]},{"id":"s01l02","stage":1,"title":"Pixels, dimensions, PPI and print size","objective":"Explain and independently execute pixels, dimensions, ppi and print size.","concept":"Pixel width × pixel height determines image samples; PPI is metadata about their physical placement, not a magic detail generator. For example 3000 pixels at 300 PPI spans 10 inches at native size. Resampling changes the pixel count.","location":"Image > Image Size","steps":["Open or create a 1200 × 800 px document.","Choose Image > Image Size and disable Resample.","Change Resolution from 72 to 300 Pixels/Inch; observe pixel dimensions.","Enable Resample, change width to 600 pixels, and compare the dimensions again."],"expected":"With Resample off, only print dimensions change; with it on, the number of pixels changes.","why":"Resampling estimates samples, whereas PPI without resampling only changes the conversion between pixels and physical units.","practice":"Find the print width of a 2400 px image at 300 PPI without a calculator dialog.","proof":"Correct answer is 8 inches; keep 2400 original pixels.","mistake":"Blindly typing 300 PPI does not improve detail in a small JPEG.","tip":"Keep Resample off while testing print-size relationships.","question":"What does changing PPI with Resample disabled alter?","answers":["Physical print size only","Pixel width","Number of layers"],"correct":0,"explanation":"Resampling estimates samples, whereas PPI without resampling only changes the conversion between pixels and physical units.","use":"Use these measurements when preparing screen assets and calculating native-size photographic prints without inventing image detail.","prerequisites":["s01l01"],"next":"s01l03","previous":"s01l01","connections":["s01l03"],"completion":["Correct answer is 8 inches; keep 2400 original pixels.","Explain the underlying mechanism in your own words: Resampling estimates samples, whereas PPI without resampling only changes the conversion between pixels and physical units."]},{"id":"s01l03","stage":1,"title":"Create, open, save and close safely","objective":"Explain and independently execute create, open, save and close safely.","concept":"A layered PSD or large PSB is a working master; JPEG is a usually flattened, lossy delivery copy; PNG can retain alpha but is not a layered PSD replacement. Work on copies and save an editable source.","location":"File > New; File > Open; File > Save As; File > Save a Copy","steps":["Create a 1000 × 800 px RGB document, then paint a mark on a new layer.","Choose File > Save As and save a local PSD named 01-master.psd.","Reopen it and verify the Layers panel contains the painted layer.","Use File > Save a Copy to create a JPEG or PNG delivery file; reopen separately."],"expected":"The PSD retains distinct layers; an exported flattened file is for distribution.","why":"Working and delivery files have different jobs; reversible structure belongs in the master.","practice":"Make a folder named project and save master.psd plus a delivery.png.","proof":"Reopen master.psd and demonstrate that the mark can be independently hidden.","mistake":"Do not overwrite the only layered master with a flattened format.","tip":"Use revision suffixes or versioned folders for critical deliverables.","question":"What should be kept for revising layers later?","answers":["JPEG only","Screenshot","PSD master"],"correct":2,"explanation":"Working and delivery files have different jobs; reversible structure belongs in the master.","use":"Use a layered master plus separate delivery files whenever a client may request revisions after an export.","prerequisites":["s01l02"],"next":"s01l04","previous":"s01l02","connections":["s01l04"],"completion":["Reopen master.psd and demonstrate that the mark can be independently hidden.","Explain the underlying mechanism in your own words: Working and delivery files have different jobs; reversible structure belongs in the master."]},{"id":"s01l04","stage":1,"title":"Interface, panels, workspaces and preferences","objective":"Explain and independently execute interface, panels, workspaces and preferences.","concept":"The Toolbar chooses an operation; the Options bar changes its parameters; panels expose the document structure and adjustment controls. A workspace stores panel layout, not image pixels. Shortcuts may be intercepted by text fields.","location":"Window > Workspace; Window > Layers; Window > Properties; Edit > Preferences > General","steps":["Open Window > Layers and Window > Properties.","Drag a panel tab to rearrange the workspace; restore it using Window > Workspace > Reset Essentials (when Essentials is active).","Select Edit > Preferences > General and inspect settings without changing unknown options.","Click inside and outside a numeric field; test a tool key only when focus is off the field."],"expected":"Panels can be repositioned without changing the image; keyboard focus affects commands.","why":"UI layout is separate from document content, so workspace changes are safe to experiment with.","practice":"Configure a workspace with Layers, Properties and History visible; restore Essentials.","proof":"Locate both panels and show the default layout again.","mistake":"If a shortcut types a letter into a field, click the canvas or press Esc to exit the field.","tip":"Save a custom workspace only after its layout is useful.","question":"Which choice restores a workspace layout?","answers":["File > Export","Window > Workspace > Reset Essentials","Image > Mode"],"correct":1,"explanation":"UI layout is separate from document content, so workspace changes are safe to experiment with.","use":"Use a consistent workspace when switching between retouching, compositing and layout without altering document content.","prerequisites":["s01l03"],"next":"s01l05","previous":"s01l03","connections":["s01l05"],"completion":["Locate both panels and show the default layout again.","Explain the underlying mechanism in your own words: UI layout is separate from document content, so workspace changes are safe to experiment with."]},{"id":"s01l05","stage":1,"title":"Zoom, pan, rulers and guides","objective":"Explain and independently execute zoom, pan, rulers and guides.","concept":"View zoom changes screen magnification, not pixel content. Rulers, guides and the Info panel help measure and align without altering artwork. A hand-pan does not move document layers.","location":"View > Rulers; View > New Guide; Window > Info; Zoom Tool; Hand Tool","steps":["Open a document and press Ctrl+0 to fit it on screen.","Press Ctrl+1 to inspect 100% view.","Press Ctrl+R to display rulers, then drag a guide from a ruler.","Use Hand Tool (H) to pan around the canvas and inspect the Info panel."],"expected":"The document content stays fixed as the view changes and guide overlays appear.","why":"Display transformations and editing transformations are independent.","practice":"Set horizontal and vertical guides at the canvas midpoint and inspect at 100%.","proof":"Guides intersect at the middle without changing any pixel.","mistake":"Do not mistake low zoom interpolation for actual file blur.","tip":"At 100%, judge edge sharpness more reliably than at arbitrary zoom.","question":"Does zooming to 400% add pixels?","answers":["No","Yes, four times","Yes, only for PSD"],"correct":0,"explanation":"Display transformations and editing transformations are independent.","use":"Use 100% zoom for pixel judgment and guides/rulers for repeatable spacing before export.","prerequisites":["s01l04"],"next":"s01l06","previous":"s01l04","connections":["s01l06"],"completion":["Guides intersect at the middle without changing any pixel.","Explain the underlying mechanism in your own words: Display transformations and editing transformations are independent."]},{"id":"s01l06","stage":1,"title":"History, undo and disciplined experiments","objective":"Explain and independently execute history, undo and disciplined experiments.","concept":"Undo reverses recent actions but is not a durable backup; History states can be lost when a file closes or the list is purged. Save versions before destructive experiments.","location":"Edit > Undo; Window > History","steps":["Create a shape layer and paint three distinct short strokes on a new pixel layer.","Press Ctrl+Z once and observe the most recent step disappear.","Open Window > History and select an earlier state.","Return to the newest desired state, then save the PSD as v02.psd."],"expected":"History walks through session states; the saved PSD records only the chosen current result.","why":"History is temporal state, not a substitute for named snapshots or file versions.","practice":"Make three editing changes, deliberately revert one and create a new saved version.","proof":"Show a v01 and v02 file and explain their differences.","mistake":"Jumping to a past History state and making new edits may discard later redo states.","tip":"Duplicate a layer before testing filters or retouching.","question":"What survives closing and reopening a document?","answers":["All unsaved History states","Current undo buffer","Saved PSD versions"],"correct":2,"explanation":"History is temporal state, not a substitute for named snapshots or file versions.","use":"Use History for immediate experiments, but save versioned PSDs before risky reconstruction or filters.","prerequisites":["s01l05"],"next":"s02l01","previous":"s01l05","connections":["s02l01","s01l01"],"completion":["Show a v01 and v02 file and explain their differences.","Explain the underlying mechanism in your own words: History is temporal state, not a substitute for named snapshots or file versions."]},{"id":"s02l01","stage":2,"title":"Canvas size, crop and image size","objective":"Explain and independently execute canvas size, crop and image size.","concept":"Canvas Size adds or removes document area; Crop changes the framing; Image Size resamples or reinterprets resolution. Their effects differ despite all changing visible bounds.","location":"Image > Canvas Size; Crop Tool (C); Image > Image Size","steps":["Create 800 × 600 px with two Shape layers.","Choose Image > Canvas Size and set Width to 1000 px, keeping anchor centered.","Choose Crop Tool (C), drag a tighter frame and commit with Enter.","Choose Image > Image Size and compare pixel dimensions before resampling."],"expected":"Canvas expands first; crop restricts framing; resampling alters sample count.","why":"Three commands solve layout, composition and pixel-density problems respectively.","practice":"Prepare two outputs from one master: wide banner and cropped square without harming the master.","proof":"Record dimensions of each version and retain the original master.","mistake":"Cropping with Delete Cropped Pixels enabled removes hidden pixels.","tip":"Disable Delete Cropped Pixels when you need an adjustable crop.","question":"Which increases empty document area without resampling existing artwork?","answers":["Smart Sharpen","Canvas Size","Image Size with Resample"],"correct":1,"explanation":"Three commands solve layout, composition and pixel-density problems respectively.","use":"Use crop, canvas size and image size as separate choices for framing, adding space and changing resolution.","prerequisites":["s01l06"],"next":"s02l02","previous":"s01l06","connections":["s02l02","s01l02"],"completion":["Record dimensions of each version and retain the original master.","Explain the underlying mechanism in your own words: Three commands solve layout, composition and pixel-density problems respectively."]},{"id":"s02l02","stage":2,"title":"Create, rename, reorder and group layers","objective":"Explain and independently execute create, rename, reorder and group layers.","concept":"Layers composite top-to-bottom. Visibility, opacity, locks and groups change the editing structure, not the pixel size of the canvas. Accurate names matter during revisions.","location":"Window > Layers; Layer > New > Layer; Layer > Group Layers","steps":["Create three layers with colored rectangles on each.","Rename them Background color, Middle form, and Foreground accent.","Drag their order in Layers and toggle the eye icon.","Select related layers and press Ctrl+G to create a group."],"expected":"Front layers cover rear layers; hiding or reordering visibly changes overlap.","why":"Layer order is a compositing operation, not merely a file organizer.","practice":"Build a three-color geometric composition using six named layers in two groups.","proof":"Hide either group and identify exactly what changes.","mistake":"Painting on the wrong selected layer causes unexpected changes.","tip":"Use descriptive names before a file reaches dozens of layers.","question":"Which panel controls layer stacking?","answers":["Layers","Histogram","Navigator"],"correct":0,"explanation":"Layer order is a compositing operation, not merely a file organizer.","use":"Use descriptive layer names and groups when a multi-element design must be handed to someone else.","prerequisites":["s02l01"],"next":"s02l03","previous":"s02l01","connections":["s02l03","s01l03"],"completion":["Hide either group and identify exactly what changes.","Explain the underlying mechanism in your own words: Layer order is a compositing operation, not merely a file organizer."]},{"id":"s02l03","stage":2,"title":"Move, align and distribute components","objective":"Explain and independently execute move, align and distribute components.","concept":"Move changes layer position; align brings selected items to a common reference; distribute spaces multiple items evenly. Transform changes dimensions, rotation or orientation.","location":"Move Tool (V); Edit > Free Transform","steps":["Make three distinct square Shape layers.","Select all three in Layers, choose Move Tool (V), and inspect alignment/distribution controls in the Options bar.","Align their top edges, then distribute their horizontal centers.","Select one square and press Ctrl+T; resize with a corner handle and commit."],"expected":"Three elements share a common top alignment and regular spacing; one element scales.","why":"Geometry operations use selected layer bounds and alignment reference, not assumed eyeballing.","practice":"Lay out three icon tiles with consistent spacing and top alignment.","proof":"Use ruler guides to check alignment at 100%.","mistake":"Alignment and Distribute require the correct target layers, selection and sometimes an explicit reference; check the Options bar before assuming they will operate.","tip":"Use guides and Smart Guides for precision, but inspect actual positions.","question":"What is the purpose of Distribute?","answers":["Flatten all layers","Change color profile","Make spacing systematic"],"correct":2,"explanation":"Geometry operations use selected layer bounds and alignment reference, not assumed eyeballing.","use":"Use alignment/distribution and numeric transforms for tiled layouts, badges and systematic mockups.","prerequisites":["s02l02"],"next":"s02l04","previous":"s02l02","connections":["s02l04","s01l04"],"completion":["Use ruler guides to check alignment at 100%.","Explain the underlying mechanism in your own words: Geometry operations use selected layer bounds and alignment reference, not assumed eyeballing."]},{"id":"s02l04","stage":2,"title":"Transparency, alpha and the checkerboard","objective":"Explain and independently execute transparency, alpha and the checkerboard.","concept":"Transparency means pixels contribute partially or not at all to an output. The checkerboard is a display indicator, not actual artwork; exporting JPEG cannot preserve alpha.","location":"Window > Layers; File > Export > Export As","steps":["Create a new document with Transparent Background Contents.","Draw an opaque ellipse on a Shape layer.","Hide any opaque background and observe checkerboard around it.","Use File > Export > Export As, choose PNG and enable Transparency if available."],"expected":"PNG retains clear surrounding pixels; checkerboard appears only in the workspace.","why":"An alpha channel controls opacity of pixel contributions, distinct from their RGB colors.","practice":"Export a 512 × 512 transparent badge with no white rectangle.","proof":"Open the PNG over a dark layer and verify no white border.","mistake":"A hidden white background layer is not the same as an exported white fill.","tip":"Check exported transparency in a second viewer or document.","question":"Which format normally preserves transparency for web assets?","answers":["BMP with default settings","PNG","JPEG"],"correct":1,"explanation":"An alpha channel controls opacity of pixel contributions, distinct from their RGB colors.","use":"Use alpha transparency for logos, stickers, overlays and icons that must sit on varied backgrounds.","prerequisites":["s02l03"],"next":"s02l05","previous":"s02l03","connections":["s02l05","s01l05"],"completion":["Open the PNG over a dark layer and verify no white border.","Explain the underlying mechanism in your own words: An alpha channel controls opacity of pixel contributions, distinct from their RGB colors."]},{"id":"s02l05","stage":2,"title":"Layer styles and reusable appearance","objective":"Explain and independently execute layer styles and reusable appearance.","concept":"Layer effects such as Stroke, Drop Shadow and Color Overlay are attached to the layer instead of baked into pixels. Effect order, size and blending affect the result.","location":"Layer > Layer Style > Blending Options; Layers panel fx","steps":["Create a rounded rectangle Shape layer.","Double-click its empty layer row area to open Layer Style.","Add Stroke, set Position to Inside and Size to 8 px.","Add Drop Shadow with modest Distance and Size; then toggle fx visibility."],"expected":"Stroke and shadow appear and can be disabled without altering the shape path.","why":"Effects are parameterized render steps applied to content boundaries.","practice":"Make a reusable badge with 2 styles and save as PSD.","proof":"Reopen effects and change stroke width without repainting.","mistake":"Do not confuse layer Fill 0% with Opacity 0%—styles may remain visible at Fill 0%.","tip":"Use subtle shadows; large opaque shadows often look artificial.","question":"How can a stroke remain independently adjustable?","answers":["Layer Style","Rasterize layer","JPEG export"],"correct":0,"explanation":"Effects are parameterized render steps applied to content boundaries.","use":"Use live layer styles for reusable outlined text, subtle shadows and brand-consistent interface graphics.","prerequisites":["s02l04"],"next":"s02l06","previous":"s02l04","connections":["s02l06","s01l06"],"completion":["Reopen effects and change stroke width without repainting.","Explain the underlying mechanism in your own words: Effects are parameterized render steps applied to content boundaries."]},{"id":"s02l06","stage":2,"title":"Smart Guides, grids and measurement","objective":"Explain and independently execute smart guides, grids and measurement.","concept":"Guides, grids and rulers organize precision work. Snapping may be toggled; alignment must be checked rather than assumed from temporary overlays.","location":"View > Show > Grid; View > Snap; View > Rulers","steps":["Create a 1000 × 1000 px document.","Show grid using View > Show > Grid and enable View > Snap if desired.","Draw four evenly sized shape tiles and position them near grid intersections.","Temporarily hide the grid and evaluate spacing at fit view."],"expected":"Tiles align consistently without grid lines appearing in exported artwork.","why":"Guides and grids are nonprinting reference overlays.","practice":"Construct a four-tile contact sheet with equal margins and gaps.","proof":"Use guides to measure equal borders on every side.","mistake":"A grid unit is not necessarily one pixel; inspect preferences for spacing.","tip":"For precise print measurements, select suitable ruler units.","question":"Do guides normally appear in exported PNG files?","answers":["Always","Only in CMYK","No"],"correct":2,"explanation":"Guides and grids are nonprinting reference overlays.","use":"Use Smart Guides and grid snapping where repeated margins and exact alignment matter more than visual guesswork.","prerequisites":["s02l05"],"next":"s03l01","previous":"s02l05","connections":["s03l01","s02l01"],"completion":["Use guides to measure equal borders on every side.","Explain the underlying mechanism in your own words: Guides and grids are nonprinting reference overlays."]},{"id":"s03l01","stage":3,"title":"Marquee and lasso: selecting regions","objective":"Explain and independently execute marquee and lasso: selecting regions.","concept":"A selection is a temporary spatial constraint on editing, often shown as marching ants. Geometric selections are suitable for hard-edged areas; freehand selections suit irregular boundaries.","location":"Rectangular Marquee Tool (M); Lasso Tool (L); Select > Deselect","steps":["Create a document with a colored pixel layer.","Use Rectangular Marquee (M) to select the left half.","Choose Layer > New > Layer, then Edit > Fill using a foreground color.","Press Ctrl+D, use Lasso (L) to trace a rough area and fill on a separate layer."],"expected":"Only selected areas receive fills; deselection removes the boundary, not the filled pixels.","why":"Selection masks specify edit coverage rather than storing artwork by themselves.","practice":"Create an abstract poster with one sharp rectangle and one freeform filled region.","proof":"Each fill occupies only its intended selected boundary.","mistake":"Watch whether the selection is set to New, Add, Subtract or Intersect in the Options bar.","tip":"Feathering should be 0 px for crisp geometric artwork.","question":"What does Ctrl+D do in a selection workflow?","answers":["Duplicate layer","Deselect","Delete selected pixels"],"correct":1,"explanation":"Selection masks specify edit coverage rather than storing artwork by themselves.","use":"Use geometric selections for bounded fills, crops and controlled local pixel operations.","prerequisites":["s02l06"],"next":"s03l02","previous":"s02l06","connections":["s03l02","s02l02"],"completion":["Each fill occupies only its intended selected boundary.","Explain the underlying mechanism in your own words: Selection masks specify edit coverage rather than storing artwork by themselves."]},{"id":"s03l02","stage":3,"title":"Object Selection, Quick Selection and color range","objective":"Explain and independently execute object selection, quick selection and color range.","concept":"Object Selection detects likely objects; Quick Selection grows a brush-guided selection based on edges; Color Range targets sampled colors and tolerance. Each fails differently on low contrast.","location":"Object Selection Tool (W group); Quick Selection Tool (W group); Selection Brush Tool (L group); Select > Color Range","steps":["Open the included practice/mask-shapes.png.","Use Object Selection Tool to target a distinct shape.","Switch to Quick Selection Tool and paint inside a colored region; use subtract mode to trim spill.","Choose Select > Color Range and sample a different solid color, adjusting Fuzziness; confirm with OK."],"expected":"Each method creates a usable but differently shaped selection.","why":"The correct selector depends on semantic objects, visible boundaries or chromatic similarity.","practice":"Select and isolate each of the three large colored elements using a different method.","proof":"After each choice, toggle Quick Mask to examine missed edges.","mistake":"Color Range may select similar colors elsewhere in the image.","tip":"Use the Selection Brush (L tool group) for painted selection refinement when available; do not confuse its overlay with a persistent layer mask.","question":"Which method targets repeated similar colors?","answers":["Color Range","Crop Tool","Character panel"],"correct":0,"explanation":"The correct selector depends on semantic objects, visible boundaries or chromatic similarity.","use":"Use a selection method matched to object shape, edge contrast and color complexity before refining a mask.","prerequisites":["s03l01"],"next":"s03l03","previous":"s03l01","connections":["s03l03","s02l03"],"completion":["After each choice, toggle Quick Mask to examine missed edges.","Explain the underlying mechanism in your own words: The correct selector depends on semantic objects, visible boundaries or chromatic similarity."]},{"id":"s03l03","stage":3,"title":"Layer masks: hiding without deleting","objective":"Explain and independently execute layer masks: hiding without deleting.","concept":"A raster layer mask is grayscale coverage: white reveals, black hides, gray partially reveals. The pixels underneath are intact. Painting on a mask changes visibility rather than source RGB values.","location":"Layer > Layer Mask > Reveal All; Window > Layers","steps":["Open practice/mask-shapes.png.","Duplicate the image layer with Ctrl+J.","Choose Layer > Layer Mask > Reveal All and click the mask thumbnail.","Paint black with Brush (B) to hide part of the upper layer; press X to switch colors and paint white to restore it."],"expected":"Part of the duplicate disappears and returns without losing RGB pixels.","why":"The mask multiplies the layer opacity at each location.","practice":"Create a diagonal blend between two differently colored layers using a mask.","proof":"You can reverse or refine the blend entirely by repainting the mask.","mistake":"Check whether the image thumbnail or mask thumbnail is selected before painting.","tip":"Alt-click a mask thumbnail to inspect the grayscale mask directly.","question":"What restores a hidden area on a standard white layer mask?","answers":["Delete pixels","Flatten document","Paint white on mask"],"correct":2,"explanation":"The mask multiplies the layer opacity at each location.","use":"Use a layer mask wherever temporary isolation, retouch restraint or revision-friendly concealment is required.","prerequisites":["s03l02","s02l02","s02l04"],"next":"s03l04","previous":"s03l02","connections":["s03l04","s02l04"],"completion":["You can reverse or refine the blend entirely by repainting the mask.","Explain the underlying mechanism in your own words: The mask multiplies the layer opacity at each location."]},{"id":"s03l04","stage":3,"title":"Select and Mask: refining difficult boundaries","objective":"Explain and independently execute select and mask: refining difficult boundaries.","concept":"Edge refinement considers transitions, fine strands and color contamination. Hair and transparent items rarely have an objectively perfect binary edge. Output to a new layer with mask to preserve the original. Photoshop 27.11 adds AI-powered Enhance edge refinement; availability or processing conditions should be checked in the live selection workflow.","location":"Select > Select and Mask","steps":["Use practice/mask-shapes.png or an owned portrait with a clear background.","Create a rough subject selection using Quick Selection.","Open Select > Select and Mask, inspect On Black and On White views.","Adjust Smooth/Feather/Contrast sparingly and Output To: New Layer with Layer Mask.","If the 27.11 Enhance edge control is available, compare its result with standard Select and Mask refinement; retain the version with fewer fringes rather than assuming AI is always better."],"expected":"A separate subject layer appears with a retouchable mask; edge quality varies by source.","why":"A refined mask models partial pixel coverage instead of hard clipping alone.","practice":"Extract a subject and place it on three differently colored backgrounds.","proof":"No obvious old-background fringe at 100% on all three tests.","mistake":"Large Feather values cause a halo; excessive Contrast destroys wispy details.","tip":"Inspect both light and dark backgrounds. Enhance edge is a version-specific, AI-assisted option; availability and processing requirements are not a promise of offline use.","question":"Why test extraction on different backgrounds?","answers":["To improve PPI","To expose edge halos","To increase file size"],"correct":1,"explanation":"A refined mask models partial pixel coverage instead of hard clipping alone.","use":"Use Select and Mask for hair, soft edges and contrast-dependent composites that must work on multiple backgrounds.","prerequisites":["s03l03","s03l02"],"next":"s03l05","previous":"s03l03","connections":["s03l05","s02l05"],"completion":["No obvious old-background fringe at 100% on all three tests.","Explain the underlying mechanism in your own words: A refined mask models partial pixel coverage instead of hard clipping alone."]},{"id":"s03l05","stage":3,"title":"Quick Mask, channels and saved selections","objective":"Explain and independently execute quick mask, channels and saved selections.","concept":"Quick Mask visualizes selection coverage as a temporary overlay. Selections can be saved as alpha channels and loaded later, independent of a layer mask. Channel thumbnails may also be inspected for contrast.","location":"Quick Mask Mode button in Toolbar or Q; Select > Save Selection; Window > Channels","steps":["Make a lasso selection on an image.","Press Q to enter Quick Mask and paint black or white to revise coverage.","Press Q again, then Select > Save Selection with name detail-boundary.","Deselect, open Window > Channels, and use Select > Load Selection to restore it."],"expected":"The refined selected area returns after being saved and loaded.","why":"An alpha channel stores grayscale selection coverage for reuse.","practice":"Create two named selections for separate image regions and reload each.","proof":"Both can be loaded without recreating the marquee.","mistake":"Do not edit a color channel accidentally when you intend to paint the Quick Mask.","tip":"Name saved selections according to meaning, not date alone.","question":"What does a saved alpha channel preserve?","answers":["Selection coverage","A complete editable font","Document history"],"correct":0,"explanation":"An alpha channel stores grayscale selection coverage for reuse.","use":"Use saved selection channels when the same complex region needs several separate corrections later.","prerequisites":["s03l04"],"next":"s03l06","previous":"s03l04","connections":["s03l06","s02l06"],"completion":["Both can be loaded without recreating the marquee.","Explain the underlying mechanism in your own words: An alpha channel stores grayscale selection coverage for reuse."]},{"id":"s03l06","stage":3,"title":"Clipping masks versus vector masks","objective":"Explain and independently execute clipping masks versus vector masks.","concept":"A clipping mask uses the transparency of a lower base layer to limit upper artwork. A vector mask uses an editable path boundary. A raster mask stores pixel coverage. They solve related but distinct problems.","location":"Layer > Create Clipping Mask; Layer > Vector Mask","steps":["Make a text or rectangle Shape layer called container.","Place a colorful pixel layer immediately above it and choose Layer > Create Clipping Mask.","Change the base shape and watch the image clip to its outline.","On a different pixel layer, draw a path and explore Layer > Vector Mask > Current Path."],"expected":"One image is bounded by base-layer opacity; another by a vector path.","why":"Clipping follows the lower layer; vector masks are path-defined.","practice":"Place an image within a word and a separate image in an elliptical vector boundary.","proof":"Resizing the lower text/shape updates the visible crop.","mistake":"A clipping mask is not the same as combining two layers permanently.","tip":"Use editable text or shape bases for flexible mockups.","question":"What determines a clipping mask boundary?","answers":["Canvas size","Resolution metadata","Transparency of its base layer"],"correct":2,"explanation":"Clipping follows the lower layer; vector masks are path-defined.","use":"Use clipping masks for content inside editable letters/shapes and vector masks for crisp geometric reveal boundaries.","prerequisites":["s03l05","s02l02","s03l03"],"next":"s04l01","previous":"s03l05","connections":["s04l01","s03l01"],"completion":["Resizing the lower text/shape updates the visible crop.","Explain the underlying mechanism in your own words: Clipping follows the lower layer; vector masks are path-defined."]},{"id":"s04l01","stage":4,"title":"Adjustment layers and scoped corrections","objective":"Explain and independently execute adjustment layers and scoped corrections.","concept":"Adjustment layers compute a tonal or color transformation above source layers. Their built-in masks let you target a region without duplicating source pixels. In Photoshop 27.10 and later, Light is a dedicated editable adjustment layer providing Exposure, Contrast, Highlights, Shadows, Whites and Blacks; it is not the same panel as traditional Curves.","location":"Layer > New Adjustment Layer > Curves; Window > Properties","steps":["Open practice/tone-gradient.png.","Choose Layer > New Adjustment Layer > Curves.","Raise a midtone point slightly, then click the mask thumbnail and paint black over one side.","Toggle adjustment layer visibility to compare.","Add Layer > New Adjustment Layer > Light in Photoshop 27.11; test Highlights −15 and Shadows +15 in Properties, then toggle visibility and compare with the Curves result."],"expected":"Only the unmasked side becomes brighter; the original gradient remains intact.","why":"A function maps input tonal values to new output values, modulated by mask coverage.","practice":"Make the left half brighter without touching the right; save editable PSD.","proof":"Hiding adjustment restores the unaltered source instantly.","mistake":"If changes affect everything, inspect the adjustment mask and clipping.","tip":"Name each adjustment by intent such as mids lift or cool highlights. For six basic tonal controls try Light; for exact curve shapes and channel control use Curves.","question":"Which allows later editing of the tonal mapping?","answers":["JPEG","Curves adjustment layer","Image > Adjustments applied to pixels"],"correct":1,"explanation":"A function maps input tonal values to new output values, modulated by mask coverage.","use":"Use adjustment layers when tonal or color changes need client-review toggles and separately controlled masks.","prerequisites":["s03l06"],"next":"s04l02","previous":"s03l06","connections":["s04l02","s03l02"],"completion":["Hiding adjustment restores the unaltered source instantly.","Explain the underlying mechanism in your own words: A function maps input tonal values to new output values, modulated by mask coverage."]},{"id":"s04l02","stage":4,"title":"Smart Objects: embedded versus linked","objective":"Explain and independently execute smart objects: embedded versus linked.","concept":"Smart Objects wrap original content so transforms and many filters can be reevaluated. Embedded content lives inside the PSD; linked content depends on an external file path. Neither guarantees lossless enlarging beyond the source detail.","location":"File > Place Embedded; File > Place Linked; Layer > Smart Objects > Convert to Smart Object","steps":["Create a PSD master and choose File > Place Embedded for practice/mask-shapes.png.","Resize it down using Ctrl+T, commit; resize up and compare.","Place the same PNG as Linked and inspect the link indicator in Layers.","Move the linked PNG externally in Windows Explorer and note how relinking may be required."],"expected":"The embedded item travels inside the PSD; linked item references an external dependency.","why":"A Smart Object retains the source transform data; linked assets add file-system dependencies.","practice":"Make a mockup with one embedded logo and one linked reference.","proof":"List the external file required to reopen the project correctly.","mistake":"Do not assume linked assets are bundled when sharing only the PSD.","tip":"Package assets with predictable relative folder paths.","question":"Which is self-contained within the PSD?","answers":["Embedded Smart Object","Linked Smart Object","Missing link"],"correct":0,"explanation":"A Smart Object retains the source transform data; linked assets add file-system dependencies.","use":"Use embedded Smart Objects for portable components; use linked sources when shared artwork must update in multiple files.","prerequisites":["s04l01"],"next":"s04l03","previous":"s04l01","connections":["s04l03","s03l03"],"completion":["List the external file required to reopen the project correctly.","Explain the underlying mechanism in your own words: A Smart Object retains the source transform data; linked assets add file-system dependencies."]},{"id":"s04l03","stage":4,"title":"Smart Filters and reversible blur","objective":"Explain and independently execute smart filters and reversible blur.","concept":"Filters applied to supported Smart Objects appear as editable Smart Filters with their own mask. Some filters and document modes impose restrictions; not all operations become Smart Filters.","location":"Layer > Smart Objects > Convert to Smart Object; Filter > Blur > Gaussian Blur","steps":["Create a detailed pixel layer and convert it to Smart Object.","Choose Filter > Blur > Gaussian Blur and set Radius to 6 px.","Double-click Gaussian Blur under Smart Filters and change Radius to 2 px.","Paint black on the Smart Filters mask over a detail that must remain sharp."],"expected":"The blur changes reversibly; selected detail escapes the filter.","why":"The filter parameters are stored separately from source pixels and masked after computation.","practice":"Blur a simple background while keeping a central badge sharp.","proof":"Change blur radius twice after saving without duplicating source pixels.","mistake":"A large blur mask painted white exposes blur, not underlying image visibility.","tip":"Place filters on Smart Objects before committing a design.","question":"Which reopens Gaussian Blur parameters?","answers":["Rasterize","Save a JPEG","Double-click its Smart Filter entry"],"correct":2,"explanation":"The filter parameters are stored separately from source pixels and masked after computation.","use":"Use Smart Filters when sharpening or blur settings must remain adjustable after saving and reopening.","prerequisites":["s04l02"],"next":"s04l04","previous":"s04l02","connections":["s04l04","s03l04"],"completion":["Change blur radius twice after saving without duplicating source pixels.","Explain the underlying mechanism in your own words: The filter parameters are stored separately from source pixels and masked after computation."]},{"id":"s04l04","stage":4,"title":"Blend modes, opacity and fill","objective":"Explain and independently execute blend modes, opacity and fill.","concept":"Blend modes mathematically combine layer pixel values with the composite below. Opacity scales the entire layer contribution, while Fill changes the interior contribution and can behave differently with layer styles.","location":"Window > Layers > blend mode / Opacity / Fill","steps":["Make a gray-filled layer above colored rectangles.","Test Multiply, Screen and Overlay, observing darkening/lightening tendencies.","Add a Stroke layer style to the top layer.","Lower Fill to 0%, then restore and lower Opacity to 0% to compare the style."],"expected":"Multiply generally darkens, Screen brightens; Fill and Opacity affect styles differently.","why":"Blend functions and alpha multiplication are distinct steps in rendering.","practice":"Create three variations of a textured poster with different blending modes.","proof":"Explain the visual difference rather than choosing a mode by name alone.","mistake":"Blending depends strongly on the colors below; no mode has a universal look.","tip":"Compare at 100% and in the intended output color space.","question":"Which setting can hide fill while leaving some layer effects visible?","answers":["Lock Pixels","Fill 0%","Opacity 0%"],"correct":1,"explanation":"Blend functions and alpha multiplication are distinct steps in rendering.","use":"Use blend modes and Fill/Opacity controls for realistic shadow, highlight and special-effect layer composites.","prerequisites":["s04l03"],"next":"s04l05","previous":"s04l03","connections":["s04l05","s03l05"],"completion":["Explain the visual difference rather than choosing a mode by name alone.","Explain the underlying mechanism in your own words: Blend functions and alpha multiplication are distinct steps in rendering."]},{"id":"s04l05","stage":4,"title":"Blend If and conditional compositing","objective":"Explain and independently execute blend if and conditional compositing.","concept":"Blend If uses underlying or current layer brightness to reveal and conceal areas without painting masks. Split slider halves make transitions gradual; tonal changes below can alter the blend.","location":"Layer > Layer Style > Blending Options","steps":["Create a grayscale gradient layer and a bright color texture above it.","Open Blending Options for the upper layer.","Under Blend If: Gray, move the Underlying Layer dark slider to reveal dark background areas.","Alt-drag one half of a slider to split its ramp and smooth the transition."],"expected":"The upper texture fades selectively based on underlying brightness.","why":"Luminance-conditioned blending is an automatic mask derived from pixel intensities.","practice":"Integrate a light streak into a dark gradient without erasing pixels.","proof":"The transition remains editable and shows no abrupt hard band.","mistake":"A non-split slider can create severe clipping edges.","tip":"Split sliders while zoomed in to evaluate haloes.","question":"What does Underlying Layer control?","answers":["Reveal based on lower composite tone","Selection size","Document PPI"],"correct":0,"explanation":"Luminance-conditioned blending is an automatic mask derived from pixel intensities.","use":"Use Blend If to reveal underlying texture/luminance without permanently deleting or painting source pixels.","prerequisites":["s04l04"],"next":"s04l06","previous":"s04l04","connections":["s04l06","s03l06"],"completion":["The transition remains editable and shows no abrupt hard band.","Explain the underlying mechanism in your own words: Luminance-conditioned blending is an automatic mask derived from pixel intensities."]},{"id":"s04l06","stage":4,"title":"Versionable editing and review handoff","objective":"Explain and independently execute versionable editing and review handoff.","concept":"Professional files should record structure, dependencies, revision status and flattened previews. Nondestructive editing is also about naming, file integrity and a reliable recovery route.","location":"File > Save As; File > Save a Copy; Window > Layers","steps":["Open an earlier project and group source, adjustments and design layers.","Name groups 01_SOURCE, 02_EDIT and 03_OUTPUT.","Save a new PSD revision and export a PNG preview.","Close and reopen the revision, confirm no missing linked elements or font warnings."],"expected":"Editable master reopens with organized, visible layers and preview matches the intended version.","why":"Stable naming and verification prevent lost context between sessions.","practice":"Deliver a revisioned PSD and PNG preview with a short change note.","proof":"Another editor can find the source and isolate your final changes.","mistake":"A preview is not a substitute for the master.","tip":"Keep the source layer untouched or backed up.","question":"What is best for an editable client revision?","answers":["Single flattened PNG","Unlabeled working history","Organized PSD plus preview"],"correct":2,"explanation":"Stable naming and verification prevent lost context between sessions.","use":"Use versioned working documents and named adjustments for accountable client revisions and team handoffs.","prerequisites":["s04l05"],"next":"s05l01","previous":"s04l05","connections":["s05l01","s04l01"],"completion":["Another editor can find the source and isolate your final changes.","Explain the underlying mechanism in your own words: Stable naming and verification prevent lost context between sessions."]},{"id":"s05l01","stage":5,"title":"Spot healing versus healing brush","objective":"Explain and independently execute spot healing versus healing brush.","concept":"Spot Healing estimates replacement texture automatically; Healing Brush samples from a chosen source and adapts tonal appearance. Both are preferable on a separate cleanup layer when tool settings permit.","location":"Spot Healing Brush Tool (J); Healing Brush Tool (J)","steps":["Open practice/retouch-dots.png and add an empty layer named cleanup.","Choose Spot Healing Brush, set Sample All Layers in Options (if available), and dab individual dots.","Switch to Healing Brush; Alt-click a clean sample near a larger defect, then paint it.","Toggle cleanup visibility and compare texture."],"expected":"Small colored defects disappear while surrounding gradient texture remains continuous.","why":"Healing uses local statistics and source texture to blend a correction.","practice":"Remove 10 intentionally planted spots without painting on the source layer.","proof":"At 100%, repair boundaries are not visibly smeared.","mistake":"Oversized brush tips create soft or duplicated details; sample nearby.","tip":"Work from small blemishes to larger regions and inspect at 100%.","question":"Why use a blank cleanup layer?","answers":["To increase PPI","To preserve original pixels","To make JPEG lossless"],"correct":1,"explanation":"Healing uses local statistics and source texture to blend a correction.","use":"Use healing on small skin marks, dust and sensor spots where the surrounding texture supports reconstruction.","prerequisites":["s04l06"],"next":"s05l02","previous":"s04l06","connections":["s05l02","s04l02"],"completion":["At 100%, repair boundaries are not visibly smeared.","Explain the underlying mechanism in your own words: Healing uses local statistics and source texture to blend a correction."]},{"id":"s05l02","stage":5,"title":"Clone Stamp, Patch and pattern repetition","objective":"Explain and independently execute clone stamp, patch and pattern repetition.","concept":"Clone Stamp copies sampled pixels, including both texture and tonal pattern; Patch repairs a selected area using another region and may blend boundary behavior. Clone is precise but repeating source patterns can betray edits.","location":"Clone Stamp Tool (S); Patch Tool (J)","steps":["Open practice/retouch-dots.png and duplicate the background.","Use Clone Stamp (S); Alt-click a clean region and paint over an obvious spot.","Use the Patch Tool to outline a separate blemish and drag to clean texture (Source mode).","Inspect for repeated motifs; undo any noticeable repetition."],"expected":"Damage is replaced, but careless cloning can reproduce exact nearby shapes.","why":"Sampling is literal reconstruction rather than generation from scene semantics.","practice":"Repair a linear blemish using multiple short source samples.","proof":"No recognizable repeated dot or mirrored texture in the repaired region.","mistake":"Do not sample across a strong lighting gradient unnecessarily.","tip":"Resample frequently and work on an empty layer when Clone Stamp sampling supports it.","question":"What is the main risk of repeated cloning from one spot?","answers":["Visible repeated pattern","Loss of ruler units","Missing alpha channel"],"correct":0,"explanation":"Sampling is literal reconstruction rather than generation from scene semantics.","use":"Use cloning for straight structures and patterned texture that automatic healing tends to distort.","prerequisites":["s05l01"],"next":"s05l03","previous":"s05l01","connections":["s05l03","s04l03"],"completion":["No recognizable repeated dot or mirrored texture in the repaired region.","Explain the underlying mechanism in your own words: Sampling is literal reconstruction rather than generation from scene semantics."]},{"id":"s05l03","stage":5,"title":"Remove tool and content-aware corrections","objective":"Explain and independently execute remove tool and content-aware corrections.","concept":"Remove Tool estimates plausible replacement content from surrounding context; Content-Aware Fill gives more explicit region and sampling control. Some Remove models process on device after download; cloud options differ.","location":"Remove Tool (J group); Edit > Content-Aware Fill","steps":["Open a photograph or the retouch practice PNG; duplicate or create a cleanup layer.","Paint over an unwanted mark using Remove Tool, using its configured processing mode.","Undo if needed; select a larger unwanted area with Lasso.","Choose Edit > Content-Aware Fill, inspect preview/sampling region and output to a new layer."],"expected":"Unwanted area is reconstructed; results differ by local texture and model choice.","why":"These methods infer missing content and may invent implausible structure.","practice":"Remove an isolated mark and a larger distraction, compare both methods.","proof":"Edges, repeated lines and texture remain consistent at 100%.","mistake":"Generated repairs must be checked for duplicated objects and factual distortion.","tip":"Choose Remove processing mode deliberately: on-device requires an available locally downloaded model and suitable hardware; cloud processing requires service access. Confirm labels in 27.11.","question":"Which gives explicit sampling-region preview?","answers":["Marquee tool","History panel","Content-Aware Fill workspace"],"correct":2,"explanation":"These methods infer missing content and may invent implausible structure.","use":"Use Remove/Content-Aware techniques for distractions when inpainted content can be checked against real context.","prerequisites":["s05l02"],"next":"s05l04","previous":"s05l02","connections":["s05l04","s04l04"],"completion":["Edges, repeated lines and texture remain consistent at 100%.","Explain the underlying mechanism in your own words: These methods infer missing content and may invent implausible structure."]},{"id":"s05l04","stage":5,"title":"Portrait retouching: texture and restraint","objective":"Explain and independently execute portrait retouching: texture and restraint.","concept":"Retouching should preserve pore texture, facial shape and identity. Separate tonal unevenness from isolated texture blemishes; global skin blurring loses realistic detail.","location":"Healing Brush Tool; Layer > New Adjustment Layer > Curves","steps":["Use an authorized portrait; duplicate the source layer and create cleanup above it.","Heal isolated temporary blemishes at 100%, not permanent identifying marks by default.","Add a Curves adjustment layer and invert its mask using Ctrl+I after selecting the mask.","Paint soft white at low brush opacity to lighten only selected shadow regions."],"expected":"Skin looks naturally even, with fine texture intact and no obvious patches.","why":"Selective local correction changes specific problems while preserving normal surface variation.","practice":"Edit a portrait using no more than two healing passes and two subtle tonal adjustments.","proof":"Toggle off all retouch layers: identity and natural skin texture remain recognizable.","mistake":"Avoid excessive smoothing, reshaping or removing meaningful identity features.","tip":"Zoom out regularly to judge whether local edits remain believable.","question":"Best first step for one small blemish?","answers":["Flatten all layers","Localized healing","Global blur"],"correct":1,"explanation":"Selective local correction changes specific problems while preserving normal surface variation.","use":"Use conservative portrait retouching where subject texture and identity must remain recognizable.","prerequisites":["s05l03","s03l03","s04l01"],"next":"s05l05","previous":"s05l03","connections":["s05l05","s04l05"],"completion":["Toggle off all retouch layers: identity and natural skin texture remain recognizable.","Explain the underlying mechanism in your own words: Selective local correction changes specific problems while preserving normal surface variation."]},{"id":"s05l05","stage":5,"title":"Dodge and burn for form","objective":"Explain and independently execute dodge and burn for form.","concept":"Dodge brightens and burn darkens local areas. Separate Curves layers with masks provide adjustable and often safer light shaping than repeatedly brushing the original pixels.","location":"Layer > New Adjustment Layer > Curves; Brush Tool (B)","steps":["Create a curves layer raising midtones and name Dodge.","Invert its white mask to black with Ctrl+I.","Create a second Curves layer lowering midtones named Burn; invert mask.","Paint white at low opacity on respective masks to refine highlights and shadows."],"expected":"Local form and contrast improve without obvious bright or dark brush circles.","why":"Small spatial tone changes reinforce perceived lighting and shape.","practice":"Build a simple ball from practice/tone-gradient.png using subtle dodge/burn.","proof":"Smooth gradual change with no patchy halos at 100%.","mistake":"Painting a mask at 100% brush opacity creates harsh patches.","tip":"Use a soft brush at 5–15% opacity for gradual work.","question":"Where should you paint for editable dodge/burn?","answers":["On Curves layer masks","Directly on background pixels","In Channels as RGB"],"correct":0,"explanation":"Small spatial tone changes reinforce perceived lighting and shape.","use":"Use Curves-based dodge/burn for local dimensionality without permanently altering the raw photo layer.","prerequisites":["s05l04","s04l01","s03l03"],"next":"s05l06","previous":"s05l04","connections":["s05l06","s04l06"],"completion":["Smooth gradual change with no patchy halos at 100%.","Explain the underlying mechanism in your own words: Small spatial tone changes reinforce perceived lighting and shape."]},{"id":"s05l06","stage":5,"title":"Liquify, perspective and ethical changes","objective":"Explain and independently execute liquify, perspective and ethical changes.","concept":"Liquify warps local geometry; perspective correction aligns planar structures. Geometric editing can alter identity and meaning: disclose material manipulations in documentary or evidentiary contexts.","location":"Filter > Liquify; Edit > Transform > Perspective","steps":["Create a patterned layer and convert to a Smart Object.","Choose Filter > Liquify, use Forward Warp with modest pressure and commit.","Reopen the Smart Filter to revise; compare straight lines.","Separately use Edit > Transform > Perspective on a shape and inspect convergence."],"expected":"Objects bend or converge predictably; Smart Filter settings remain reversible when supported.","why":"Warping moves sample coordinates and can distort backgrounds and scale cues.","practice":"Correct an obviously tilted rectangular label while preserving its proportions.","proof":"Edges align more plausibly without stretching the text unnaturally.","mistake":"Do not use Liquify casually for identity-sensitive retouching.","tip":"Use a duplicate/Smart Object and compare to unedited reference.","question":"What makes Liquify adjustable after application?","answers":["Flattening image","JPEG save","Applying as supported Smart Filter"],"correct":2,"explanation":"Warping moves sample coordinates and can distort backgrounds and scale cues.","use":"Use Liquify and perspective tools for optical or geometric correction while documenting image integrity changes.","prerequisites":["s05l05"],"next":"s05l07","previous":"s05l05","connections":["s05l07","s05l01"],"completion":["Edges align more plausibly without stretching the text unnaturally.","Explain the underlying mechanism in your own words: Warping moves sample coordinates and can distort backgrounds and scale cues."]},{"id":"s05l07","stage":5,"title":"Old photo repair and reconstruction","objective":"Explain and independently execute old photo repair and reconstruction.","concept":"Restoration begins with separating tone/fading, dirt/scratches and missing geometry. Reconstructing missing faces or text is inherently interpretive, not an authentic recovery of historical facts.","location":"Spot Healing Brush; Clone Stamp Tool; Layer > New Adjustment Layer > Levels","steps":["Open an owned scanned photograph or practice/retouch-dots.png.","Duplicate the image layer and crop only outside borders if permitted.","Use Levels adjustment to set sensible tonal endpoints without clipping.","Retouch scratches on a separate layer; rebuild repeated lines with short Clone Stamp samples."],"expected":"Contrast improves and major marks recede while original structure stays preserved.","why":"Restoration is constrained inference: maintain provenance and reversible corrections.","practice":"Produce before/after and a note describing which pixels were reconstructed.","proof":"Original scan remains retained; reconstruction is documented.","mistake":"Do not treat AI-invented missing historical details as recovered truth.","tip":"Keep a separate original archival scan with embedded profile.","question":"For archival restoration, which is mandatory?","answers":["Delete history of intervention","Retain original and document changes","Overwrite scan"],"correct":1,"explanation":"Restoration is constrained inference: maintain provenance and reversible corrections.","use":"Use separate repair layers and an edit log for family archives, scanned prints and ethically documented restoration.","prerequisites":["s05l06"],"next":"s06l01","previous":"s05l06","connections":["s06l01","s05l02"],"completion":["Original scan remains retained; reconstruction is documented.","Explain the underlying mechanism in your own words: Restoration is constrained inference: maintain provenance and reversible corrections."]},{"id":"s06l01","stage":6,"title":"Brush fundamentals: tip, size and hardness","objective":"Explain and independently execute brush fundamentals: tip, size and hardness.","concept":"Brush Tip Shape defines diameter and hardness, Opacity controls stroke contribution, and Flow controls accumulation as the tip moves. Low flow builds color gradually.","location":"Brush Tool (B); Window > Brush Settings","steps":["Create a transparent layer and choose Brush Tool (B).","Paint three strokes at Hardness 100%, 50%, and 0% using the same diameter.","Set Opacity to 30% and paint a single stroke; then set Flow to 10% and make overlapping strokes.","Compare the buildup at intersections and edges."],"expected":"Hard brushes have crisp edges; soft brushes feather; low-flow strokes accumulate color.","why":"A brush deposits samples along a path, blended with existing pixels.","practice":"Create a reference swatch of 4 brush behaviors, label it with Type.","proof":"Describe which produces crisp contours and which builds shading.","mistake":"Painting directly on the white Background loses flexibility.","tip":"Use [ and ] for brush diameter only when the brush is focused and shortcuts are default.","question":"What makes a stroke build slowly with repeated passes?","answers":["Low Flow","Higher PPI","Canvas Size"],"correct":0,"explanation":"A brush deposits samples along a path, blended with existing pixels.","use":"Use brush opacity, flow and hardness choices to control edges, gradients and masks instead of guessing at stroke strength.","prerequisites":["s05l07"],"next":"s06l02","previous":"s05l07","connections":["s06l02","s05l03"],"completion":["Describe which produces crisp contours and which builds shading.","Explain the underlying mechanism in your own words: A brush deposits samples along a path, blended with existing pixels."]},{"id":"s06l02","stage":6,"title":"Brush dynamics and tablet pressure","objective":"Explain and independently execute brush dynamics and tablet pressure.","concept":"Shape Dynamics may vary diameter with pen pressure or other inputs. Without a pressure-capable tablet, pressure controls do not respond as expected. Smoothing stabilizes trajectories at a cost in immediacy.","location":"Window > Brush Settings; Brush Tool Options bar","steps":["Open Brush Settings and enable Shape Dynamics.","Inspect Size Jitter Control and choose Pen Pressure only if a pressure tablet is available.","Paint slow and fast curves with Smoothing 0% and then a higher value.","Compare curves; if no tablet exists, use a fixed tip and note the limitation."],"expected":"Stroke taper depends on tablet pressure; smoothing reduces small jagged deviations.","why":"Input devices determine which brush dynamics are measurable.","practice":"Make a labeled brush study with fixed size, scatter, and smoothing examples.","proof":"Report whether pen pressure is available and demonstrate smooth deliberate strokes.","mistake":"Do not mistake absent tablet pressure for an application defect.","tip":"Save a tested brush preset with a descriptive name.","question":"What hardware enables true pen-pressure size control?","answers":["Ordinary mouse only","External SSD","Pressure-sensitive tablet"],"correct":2,"explanation":"Input devices determine which brush dynamics are measurable.","use":"Use pressure and brush dynamics for natural-looking pen-tablet drawing and repeated texture creation.","prerequisites":["s06l01"],"next":"s06l03","previous":"s06l01","connections":["s06l03","s05l04"],"completion":["Report whether pen pressure is available and demonstrate smooth deliberate strokes.","Explain the underlying mechanism in your own words: Input devices determine which brush dynamics are measurable."]},{"id":"s06l03","stage":6,"title":"Color picker, swatches and sampling","objective":"Explain and independently execute color picker, swatches and sampling.","concept":"Foreground/Background colors are active state, distinct from color profiles. Eyedropper samples pixels or composites; Swatches store reusable color choices.","location":"Foreground color swatch; Eyedropper Tool (I); Window > Swatches","steps":["Open practice/color-palette.png.","Select Eyedropper (I), click a palette square and inspect Foreground color.","Open Color Picker and record hexadecimal RGB value.","Create a new layer and paint two sampled colors; save them as Swatches if supported."],"expected":"Brush strokes match sampled palette tones when same color-management conditions apply.","why":"Sampling records channel values of rendered pixels for later reuse.","practice":"Create a 5-color palette strip and verify hex values for each.","proof":"Colors can be independently repainted from saved swatches.","mistake":"Eyedropper sample size and Sample settings can alter noisy-edge results.","tip":"Sample flat interior areas, not anti-aliased edges.","question":"Which control samples a pixel color?","answers":["Dodge","Eyedropper","Hand"],"correct":1,"explanation":"Sampling records channel values of rendered pixels for later reuse.","use":"Use sampling and swatch libraries for consistent product colors, UI palettes and digital painting.","prerequisites":["s06l02"],"next":"s06l04","previous":"s06l02","connections":["s06l04","s05l05"],"completion":["Colors can be independently repainted from saved swatches.","Explain the underlying mechanism in your own words: Sampling records channel values of rendered pixels for later reuse."]},{"id":"s06l04","stage":6,"title":"Gradients, patterns and fill layers","objective":"Explain and independently execute gradients, patterns and fill layers.","concept":"A Gradient Fill layer generates a controllable continuous transition; Pattern Fill tiles a source. Compared with painting directly, fill layers preserve their parameters and mask options.","location":"Layer > New Fill Layer > Gradient; Layer > New Fill Layer > Pattern","steps":["Create a 1000 × 600 px document.","Choose Layer > New Fill Layer > Gradient; select linear transition and adjust Angle.","Open Gradient Fill properties later and change Scale.","Add a Pattern Fill layer if patterns are installed; adjust Scale then hide it to compare."],"expected":"Background colors form a consistent gradual sweep; pattern repeat changes with scale.","why":"Fill layers render procedural pixels during compositing.","practice":"Produce three backgrounds from the same master using adjustable fills.","proof":"No hand-painted seam or uneven banding visible at usual output zoom.","mistake":"Very narrow gradients in 8-bit images may band visibly.","tip":"Consider 16-bit mode for demanding smooth gradients, subject to export support.","question":"What remains editable on a Gradient Fill layer?","answers":["Gradient and angle","Only history","JPEG quantization"],"correct":0,"explanation":"Fill layers render procedural pixels during compositing.","use":"Use gradient/pattern fill layers for editable backgrounds, vignettes and repeated graphic motifs.","prerequisites":["s06l03"],"next":"s06l05","previous":"s06l03","connections":["s06l05","s05l06"],"completion":["No hand-painted seam or uneven banding visible at usual output zoom.","Explain the underlying mechanism in your own words: Fill layers render procedural pixels during compositing."]},{"id":"s06l05","stage":6,"title":"Eraser, history brush and restoration methods","objective":"Explain and independently execute eraser, history brush and restoration methods.","concept":"Eraser removes or reduces pixels; a mask usually provides the same visual result more safely. History Brush can paint an earlier image state into current pixels but depends on History source availability.","location":"Eraser Tool (E); History Brush Tool (Y); Window > History","steps":["Make a pixel layer with colored paint and duplicate it.","Erase part of the duplicate with Eraser (E) and compare with a mask on another copy.","Open History panel and review source states for History Brush.","Save and reopen: observe that the original History sequence does not remain available."],"expected":"Mask-based hiding is reversible; erasing changes alpha of the chosen pixel layer.","why":"Editing coverage and removal of stored pixels are separate concepts.","practice":"Recreate the same missing area using Eraser and using a layer mask.","proof":"Only the masked version can restore hidden content by painting white.","mistake":"Do not assume History Brush can resurrect changes after closing Photoshop.","tip":"Default to masks unless permanent pixel deletion is intentional.","question":"Which hides pixels without deleting their RGB content?","answers":["Eraser on raster layer","Flatten Image","Layer mask"],"correct":2,"explanation":"Editing coverage and removal of stored pixels are separate concepts.","use":"Use History Brush sparingly for session-based variants; prefer reversible masks for persistent revisions.","prerequisites":["s06l04","s03l03"],"next":"s06l06","previous":"s06l04","connections":["s06l06","s05l07"],"completion":["Only the masked version can restore hidden content by painting white.","Explain the underlying mechanism in your own words: Editing coverage and removal of stored pixels are separate concepts."]},{"id":"s06l06","stage":6,"title":"Digital painting with layers and value structure","objective":"Explain and independently execute digital painting with layers and value structure.","concept":"Readable digital painting begins with large value masses, then color and edge hierarchy, and finally detail. Layer organization prevents foreground/background mixing.","location":"Brush Tool (B); Window > Layers","steps":["Set up a 1200 × 800 px RGB canvas with background, midground and foreground layers.","Paint three large value masses in grayscale using a broad soft brush.","Add smaller hard-edged focal forms, then introduce a Color blend mode layer for hue.","Check the design in grayscale using a temporary Black & White adjustment."],"expected":"A coherent scene reads by value even before small details appear.","why":"Perception of form depends more on large contrasts than local decorative detail.","practice":"Paint a simple cityscape with a clear focal point using at most five layers.","proof":"At thumbnail size the focal object is still identifiable.","mistake":"Adding small details before solving composition wastes time.","tip":"Toggle between fit view and 100% while painting.","question":"What should be established first in a painting?","answers":["Output ZIP name","Large value structure","Individual eyelashes"],"correct":1,"explanation":"Perception of form depends more on large contrasts than local decorative detail.","use":"Use independent paint layers and value planning to build original illustrations with consistent lighting.","prerequisites":["s06l05"],"next":"s07l01","previous":"s06l05","connections":["s07l01","s06l01"],"completion":["At thumbnail size the focal object is still identifiable.","Explain the underlying mechanism in your own words: Perception of form depends more on large contrasts than local decorative detail."]},{"id":"s07l01","stage":7,"title":"Point type, paragraph type and editable text","objective":"Explain and independently execute point type, paragraph type and editable text.","concept":"Point type is created by clicking; paragraph type uses a bounding box. Type stays editable until rasterized, and font substitution can change line breaks and layout.","location":"Horizontal Type Tool (T); Window > Character; Window > Paragraph","steps":["Create a 1200 × 800 px document.","Choose Type Tool (T), click once and type a short headline.","Drag a text box and paste three sentences for paragraph type.","Change font size and leading in Character panel, and compare wrapping before and after resizing box."],"expected":"Headline remains a single type object; paragraph text wraps within its frame.","why":"Type layers store characters and layout rules rather than fixed painted shapes.","practice":"Design a typographic title plus a two-column paragraph block.","proof":"Both remain editable; text does not overflow its intended boxes.","mistake":"Selecting the Move Tool while editing text may require committing the text first.","tip":"Keep critical fonts installed and package font licensing information appropriately.","question":"What makes a paragraph box wrap text?","answers":["Its bounding width","Image PPI","Layer opacity"],"correct":0,"explanation":"Type layers store characters and layout rules rather than fixed painted shapes.","use":"Use live text layers for posters, thumbnails and design systems where wording may change.","prerequisites":["s06l06"],"next":"s07l02","previous":"s06l06","connections":["s07l02","s06l02"],"completion":["Both remain editable; text does not overflow its intended boxes.","Explain the underlying mechanism in your own words: Type layers store characters and layout rules rather than fixed painted shapes."]},{"id":"s07l02","stage":7,"title":"Kerning, tracking, leading and hierarchy","objective":"Explain and independently execute kerning, tracking, leading and hierarchy.","concept":"Kerning changes a specific character pair; tracking adjusts spacing across a selection; leading sets baseline-to-baseline distance. Good hierarchy depends on consistent spacing, size and contrast.","location":"Window > Character; Window > Paragraph","steps":["Type AVATAR as a headline and select the AV pair.","In Character panel, compare Metrics/Optical kerning where available and manual pair adjustment.","Select the entire heading and adjust Tracking.","Create three body lines and change Leading to compare dense versus airy layout."],"expected":"Letter and line spacing visibly change without changing the wording.","why":"Typography works as a spatial rhythm, not only the choice of font.","practice":"Create three text levels: title, subheading and body; align to a common edge.","proof":"Hierarchy is obvious in 3 seconds and no line collisions occur.","mistake":"Overtracking small body text damages legibility.","tip":"Audit at actual output size, not just an enlarged canvas.","question":"Which sets spacing between text baselines?","answers":["Kerning","Opacity","Leading"],"correct":2,"explanation":"Typography works as a spatial rhythm, not only the choice of font.","use":"Use kerning, tracking and leading to fix poor visual rhythm and readability in client-facing typography.","prerequisites":["s07l01"],"next":"s07l03","previous":"s07l01","connections":["s07l03","s06l03"],"completion":["Hierarchy is obvious in 3 seconds and no line collisions occur.","Explain the underlying mechanism in your own words: Typography works as a spatial rhythm, not only the choice of font."]},{"id":"s07l03","stage":7,"title":"Shape tools and vector operations","objective":"Explain and independently execute shape tools and vector operations.","concept":"Shape layers contain paths with fills and strokes. Combining, subtracting and intersecting shapes controls topology while keeping crisp edges at working resolution.","location":"Rectangle Tool (U); Shape mode; Path Operations in Options bar","steps":["Choose Rectangle Tool (U) and set tool mode to Shape.","Draw one rectangle and then an ellipse with separate Shape layers.","Select one Shape layer and use Path Operations to subtract an inner hole where supported.","Change fill, stroke and corner radius in Properties."],"expected":"The composite geometry responds to path operations and stays editable.","why":"Shape paths define coverage mathematically, with fills and strokes rendered at export.","practice":"Create a simple icon with a hole and 2 shape colors.","proof":"Icon still has crisp boundaries after a reversible transform.","mistake":"Drawing in Pixels mode rasterizes output instead of adding editable shapes.","tip":"Check mode (Shape/Path/Pixels) before drawing.","question":"Which mode produces a vector-edged editable shape layer?","answers":["Quick Mask","Shape","Pixels"],"correct":1,"explanation":"Shape paths define coverage mathematically, with fills and strokes rendered at export.","use":"Use vector shape paths for icons, panel backgrounds, adjustable borders and editable geometry.","prerequisites":["s07l02"],"next":"s07l04","previous":"s07l02","connections":["s07l04","s06l04"],"completion":["Icon still has crisp boundaries after a reversible transform.","Explain the underlying mechanism in your own words: Shape paths define coverage mathematically, with fills and strokes rendered at export."]},{"id":"s07l04","stage":7,"title":"Pen tool, anchor points and Bézier handles","objective":"Explain and independently execute pen tool, anchor points and bézier handles.","concept":"A Bézier path consists of anchors and direction handles; moving handles changes tangent direction and curvature. Fewer well-placed anchors typically produce smoother curves.","location":"Pen Tool (P); Direct Selection Tool (A); Window > Paths","steps":["Select Pen Tool (P) and choose Path mode.","Click two points for a straight segment; click-drag the third to create smooth handles.","Close the contour, then select Direct Selection (A) and modify a handle.","Convert path to selection using Paths panel; create a masked fill from it."],"expected":"Curved boundary changes as handles move while original samples remain untouched.","why":"Bezier segments interpolate a smooth curve between control points.","practice":"Trace a simple leaf outline with six or fewer anchors.","proof":"Curve has no visible kinks where the contour should be smooth.","mistake":"Too many points create lumpy geometry and make revision slow.","tip":"Place anchors at major direction changes, not every few pixels.","question":"What primarily controls Bézier curvature?","answers":["Direction handles","PPI","Blend mode"],"correct":0,"explanation":"Bezier segments interpolate a smooth curve between control points.","use":"Use Bézier paths for product cutouts and smooth logos where automated selections are imprecise.","prerequisites":["s07l03"],"next":"s07l05","previous":"s07l03","connections":["s07l05","s06l05"],"completion":["Curve has no visible kinks where the contour should be smooth.","Explain the underlying mechanism in your own words: Bezier segments interpolate a smooth curve between control points."]},{"id":"s07l05","stage":7,"title":"Text on paths and shape-following type","objective":"Explain and independently execute text on paths and shape-following type.","concept":"Text on a path remains editable and its baseline follows the vector path. Dynamic Text features available in recent stable releases can reflow certain shapes, but are not prerequisites for standard path text.","location":"Pen Tool (P); Type Tool (T)","steps":["Draw a curved path in Path mode with the Pen Tool.","Choose Type Tool and hover until the insertion cursor indicates path text.","Click the path and type a short phrase; use path selection to reposition the text start/end controls.","Adjust tracking to fit the curve without compression."],"expected":"Words follow the curve rather than a horizontal box.","why":"Glyph positions are laid out along a geometric baseline.","practice":"Create a circular seal with a curved top caption and a straight subtitle.","proof":"Type remains editable and avoids overlap.","mistake":"Crowded path text becomes unreadable; choose shorter copy.","tip":"Use ordinary path text before exploring 27.10 Dynamic Text behavior.","question":"What does path text follow?","answers":["A raster mask","History states","A vector baseline"],"correct":2,"explanation":"Glyph positions are laid out along a geometric baseline.","use":"Use path text for badges, labels and curved headlines while preserving editable type.","prerequisites":["s07l04","s07l01"],"next":"s07l06","previous":"s07l04","connections":["s07l06","s06l06"],"completion":["Type remains editable and avoids overlap.","Explain the underlying mechanism in your own words: Glyph positions are laid out along a geometric baseline."]},{"id":"s07l06","stage":7,"title":"Layout system and reusable mockup","objective":"Explain and independently execute layout system and reusable mockup.","concept":"Reusable graphics use guides, named layers, Smart Objects and text styles. A mockup should separate replaceable content from lighting, surface detail and branding.","location":"View > New Guide; File > Place Embedded; Window > Layers","steps":["Create a 1600 × 900 px document and guides for 64 px margins.","Draw a device/screen placeholder with a rectangular Shape
