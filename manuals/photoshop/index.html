pted by keyboard firmware or OS."},{"family":"Panels","action":"Info panel","keys":"F8","context":"Global/panel","note":"Function keys may be intercepted by keyboard firmware or OS."},{"family":"Panels","action":"Actions panel","keys":"F9","context":"Global/panel","note":"Function keys may be intercepted by keyboard firmware or OS."},{"family":"Filters","action":"Liquify workspace","keys":"Ctrl+Shift+X","context":"Document","note":"GPU requirements, layer types and active document can prevent command."},{"family":"Layer","action":"Nudge selected content 1 pixel","keys":"Arrow key","context":"Move Tool/transform","note":"Depends on selected layer/selection and active text input."},{"family":"Layer","action":"Nudge selected content 10 pixels","keys":"Shift+Arrow key","context":"Move Tool/transform","note":"Depends on selected layer/selection and active text input."}],"glossary":[{"term":"Pixel","definition":"Smallest addressable raster sample; a color/alpha value at a grid coordinate.","lesson":"s01l01","id":"glossar-pixel"},{"term":"Raster","definition":"Image stored as an array of samples rather than mathematical objects.","lesson":"s01l01","id":"glossar-raster"},{"term":"Vector","definition":"Geometry encoded by points, paths and equations, rendered to pixels for display.","lesson":"s01l01","id":"glossar-vector"},{"term":"Resolution","definition":"Context-dependent amount of detail, commonly pixel dimensions or PPI.","lesson":"s01l02","id":"glossar-resolution"},{"term":"PPI","definition":"Pixels per inch in intended output; does not by itself create detail.","lesson":"s01l02","id":"glossar-ppi"},{"term":"DPI","definition":"Dots per inch of printing hardware; not interchangeable with image PPI.","lesson":"s01l02","id":"glossar-dpi"},{"term":"Resampling","definition":"Computing a new pixel grid at different dimensions.","lesson":"s01l02","id":"glossar-resampling"},{"term":"Interpolation","definition":"Estimating sample values between original samples.","lesson":"s01l02","id":"glossar-interpolation"},{"term":"Canvas","definition":"Document's finite coordinate area.","lesson":"s02l01","id":"glossar-canvas"},{"term":"Crop","definition":"Changes visible frame and potentially removes outside pixels.","lesson":"s02l01","id":"glossar-crop"},{"term":"Canvas Size","definition":"Command expanding or contracting document bounds without image resampling.","lesson":"s02l01","id":"glossar-canvas-size"},{"term":"Image Size","definition":"Command to change dimensions/resolution and optionally resample.","lesson":"s02l01","id":"glossar-image-size"},{"term":"Layer","definition":"Independently composited source of pixels, type, shape or adjustment.","lesson":"s02l02","id":"glossar-layer"},{"term":"Stacking order","definition":"Front-to-back sequence determining occlusion/composite result.","lesson":"s02l02","id":"glossar-stacking-order"},{"term":"Group","definition":"Container organizing related layers.","lesson":"s02l02","id":"glossar-group"},{"term":"Opacity","definition":"Factor controlling the visibility of a layer or effect.","lesson":"s04l04","id":"glossar-opacity"},{"term":"Fill","definition":"Layer interior visibility setting distinct from overall Opacity when effects are used.","lesson":"s04l04","id":"glossar-fill"},{"term":"Alpha","definition":"Opacity or coverage value stored per pixel or as a channel.","lesson":"s02l04","id":"glossar-alpha"},{"term":"Transparency","definition":"Partial or total absence of opacity in compositing.","lesson":"s02l04","id":"glossar-transparency"},{"term":"Checkerboard","definition":"UI visualization of transparent areas, not source pixels.","lesson":"s02l04","id":"glossar-checkerboard"},{"term":"PSD","definition":"Native layered Photoshop document format.","lesson":"s01l03","id":"glossar-psd"},{"term":"PSB","definition":"Large Document Format for documents exceeding PSD practical limits.","lesson":"s11l05","id":"glossar-psb"},{"term":"JPEG","definition":"Lossy photographic compression; generally flattened, with no alpha.","lesson":"s01l03","id":"glossar-jpeg"},{"term":"PNG","definition":"Raster format supporting alpha transparency; not a full PSD replacement.","lesson":"s02l04","id":"glossar-png"},{"term":"TIFF","definition":"Flexible raster exchange and archival format, often supporting higher bit depths.","lesson":"s01l03","id":"glossar-tiff"},{"term":"WebP","definition":"Modern image format supporting efficient compression and optional transparency.","lesson":"s10l04","id":"glossar-webp"},{"term":"RAW","definition":"Camera sensor-derived source data needing development rather than fixed rendering.","lesson":"s08l04","id":"glossar-raw"},{"term":"DNG","definition":"Digital Negative raw container/specification supported by Camera Raw.","lesson":"s08l04","id":"glossar-dng"},{"term":"XMP sidecar","definition":"Metadata file containing develop settings for some raw workflows.","lesson":"s08l04","id":"glossar-xmp-sidecar"},{"term":"Selection","definition":"Temporary per-pixel editing coverage field.","lesson":"s03l01","id":"glossar-selection"},{"term":"Marching ants","definition":"Animated boundary depicting part of a selection threshold.","lesson":"s03l01","id":"glossar-marching-ants"},{"term":"Feather","definition":"Softens selection or mask edge transition.","lesson":"s03l04","id":"glossar-feather"},{"term":"Anti-aliasing","definition":"Blends edge pixels to reduce jagged contour appearance.","lesson":"s03l04","id":"glossar-anti-aliasing"},{"term":"Tolerance","definition":"Threshold controlling similarity in some selection/fill tools.","lesson":"s03l02","id":"glossar-tolerance"},{"term":"Color Range","definition":"Selection from color similarity and fuzziness rather than just geometric area.","lesson":"s03l02","id":"glossar-color-range"},{"term":"Quick Mask","definition":"Temporary view/edit mode showing selection coverage as mask.","lesson":"s03l05","id":"glossar-quick-mask"},{"term":"Layer mask","definition":"Grayscale visibility control attached to a layer.","lesson":"s03l03","id":"glossar-layer-mask"},{"term":"Vector mask","definition":"Visibility boundary generated from editable path geometry.","lesson":"s03l06","id":"glossar-vector-mask"},{"term":"Clipping mask","definition":"Upper layer constrained by transparency of lower base layer.","lesson":"s03l06","id":"glossar-clipping-mask"},{"term":"Alpha channel","definition":"Grayscale auxiliary channel that can store selection data.","lesson":"s03l05","id":"glossar-alpha-channel"},{"term":"Composite channel","definition":"Combined color display assembled from component channels.","lesson":"s08l02","id":"glossar-composite-channel"},{"term":"RGB","definition":"Red/green/blue additive-color channel model.","lesson":"s08l05","id":"glossar-rgb"},{"term":"CMYK","definition":"Cyan/magenta/yellow/key print-separation channel model.","lesson":"s08l05","id":"glossar-cmyk"},{"term":"Lab","definition":"Color model separating lightness from two opponent chromatic axes.","lesson":"s08l05","id":"glossar-lab"},{"term":"Grayscale","definition":"Single-intensity color mode without normal chromatic channel variation.","lesson":"s08l05","id":"glossar-grayscale"},{"term":"ICC profile","definition":"Data interpreting color numbers for a specific color space/device process.","lesson":"s08l05","id":"glossar-icc-profile"},{"term":"Embedded profile","definition":"Color profile stored in a file for correct interpretation.","lesson":"s08l05","id":"glossar-embedded-profile"},{"term":"Assign Profile","definition":"Reinterprets existing color numbers under a new profile, potentially changing appearance.","lesson":"s08l05","id":"glossar-assign-profile"},{"term":"Convert to Profile","definition":"Changes channel values to retain approximate appearance under another profile.","lesson":"s08l05","id":"glossar-convert-to-profile"},{"term":"Working space","definition":"Color space used for editing or interpreting untagged data under settings.","lesson":"s08l05","id":"glossar-working-space"},{"term":"Gamut","definition":"Range of colors representable by a device or space.","lesson":"s08l06","id":"glossar-gamut"},{"term":"Soft proof","definition":"On-screen simulation of output profile under calibrated conditions.","lesson":"s08l06","id":"glossar-soft-proof"},{"term":"Rendering intent","definition":"Rule for mapping out-of-gamut colors during conversion.","lesson":"s08l06","id":"glossar-rendering-intent"},{"term":"Bit depth","definition":"Number of binary bits per color component defining precision/range.","lesson":"s08l05","id":"glossar-bit-depth"},{"term":"8-bit/channel","definition":"Usually 256 encoded values per channel in integer representation.","lesson":"s08l05","id":"glossar-8-bit-channel"},{"term":"16-bit/channel","definition":"Higher-precision channel representation useful for smooth corrections.","lesson":"s08l05","id":"glossar-16-bit-channel"},{"term":"32-bit/channel","definition":"Floating-point precision often used for HDR workflows.","lesson":"s08l07","id":"glossar-32-bit-channel"},{"term":"HDR","definition":"High dynamic range content or representation with extended luminance information.","lesson":"s08l07","id":"glossar-hdr"},{"term":"Histogram","definition":"Count of image pixels by channel or tonal interval.","lesson":"s08l01","id":"glossar-histogram"},{"term":"Exposure","definition":"Amount of image brightness associated with captured or interpreted light.","lesson":"s08l01","id":"glossar-exposure"},{"term":"White balance","definition":"Correction for color cast from illumination or camera setting.","lesson":"s08l03","id":"glossar-white-balance"},{"term":"Clipping","definition":"Loss of differentiable highlight/shadow color values after limits are hit.","lesson":"s08l01","id":"glossar-clipping"},{"term":"Black point","definition":"Input or output value mapped to deepest intended tone.","lesson":"s08l01","id":"glossar-black-point"},{"term":"White point","definition":"Input or output value mapped to brightest intended tone.","lesson":"s08l01","id":"glossar-white-point"},{"term":"Levels","definition":"Tonal mapping through black, mid and white controls.","lesson":"s08l01","id":"glossar-levels"},{"term":"Curves","definition":"Arbitrary control-point mapping of input to output tones.","lesson":"s08l02","id":"glossar-curves"},{"term":"S-curve","definition":"Curve raising highlights and lowering shadows to increase contrast.","lesson":"s08l02","id":"glossar-s-curve"},{"term":"Color grading","definition":"Intentional global/local color style beyond basic neutrality.","lesson":"s08l03","id":"glossar-color-grading"},{"term":"HSL","definition":"Hue, saturation and lightness descriptors for color adjustment.","lesson":"s08l03","id":"glossar-hsl"},{"term":"Hue","definition":"Perceived color family or angle in color models.","lesson":"s08l03","id":"glossar-hue"},{"term":"Saturation","definition":"Color intensity relative to gray at comparable lightness.","lesson":"s08l03","id":"glossar-saturation"},{"term":"Luminance","definition":"Light-related intensity measure; specific meaning depends on space.","lesson":"s08l03","id":"glossar-luminance"},{"term":"Smart Object","definition":"Container retaining source content for transforms and supported smart filters.","lesson":"s04l02","id":"glossar-smart-object"},{"term":"Embedded Smart Object","definition":"Smart Object source stored inside PSD.","lesson":"s04l02","id":"glossar-embedded-smart-object"},{"term":"Linked Smart Object","definition":"Smart Object whose source is an external file.","lesson":"s04l02","id":"glossar-linked-smart-object"},{"term":"Smart Filter","definition":"Editable supported filter attached to a Smart Object.","lesson":"s04l03","id":"glossar-smart-filter"},{"term":"Filter mask","definition":"Grayscale control of combined Smart Filter influence.","lesson":"s04l03","id":"glossar-filter-mask"},{"term":"Adjustment layer","definition":"Non-destructive computed tone/color adjustment over underlying pixels.","lesson":"s04l01","id":"glossar-adjustment-layer"},{"term":"Blend mode","definition":"Rule mathematically combining layer and underlying image color values.","lesson":"s04l04","id":"glossar-blend-mode"},{"term":"Multiply","definition":"Blend mode tending to darken through channel multiplication.","lesson":"s04l04","id":"glossar-multiply"},{"term":"Screen","definition":"Blend mode tending to brighten through inverse multiplicative math.","lesson":"s04l04","id":"glossar-screen"},{"term":"Overlay","definition":"Contrast blend mode combining Multiply/Screen behavior conditionally.","lesson":"s04l04","id":"glossar-overlay"},{"term":"Blend If","definition":"Layer Style threshold-based visibility using tonal ranges.","lesson":"s04l05","id":"glossar-blend-if"},{"term":"Layer Style","definition":"Live appearance effects such as Stroke, Shadow and Glow.","lesson":"s02l05","id":"glossar-layer-style"},{"term":"Drop Shadow","definition":"Layer effect producing offset shadow based on layer contours.","lesson":"s02l05","id":"glossar-drop-shadow"},{"term":"Stroke","definition":"Visible line placed around a vector path or layer boundary.","lesson":"s02l05","id":"glossar-stroke"},{"term":"Transform","definition":"Geometric change such as scale, rotate, warp or skew.","lesson":"s02l03","id":"glossar-transform"},{"term":"Free Transform","definition":"General handles-based transform workflow.","lesson":"s02l03","id":"glossar-free-transform"},{"term":"Perspective","definition":"Projection geometry causing parallel 3D lines to converge in image.","lesson":"s09l01","id":"glossar-perspective"},{"term":"Vanishing point","definition":"Projected location where parallel scene lines appear to meet.","lesson":"s09l01","id":"glossar-vanishing-point"},{"term":"Horizon","definition":"Camera eye-level reference in perspective geometry.","lesson":"s09l01","id":"glossar-horizon"},{"term":"Contact shadow","definition":"Darkening immediately beneath contact where light is blocked.","lesson":"s09l02","id":"glossar-contact-shadow"},{"term":"Cast shadow","definition":"Shadow projected onto a separate surface by an object blocking light.","lesson":"s09l02","id":"glossar-cast-shadow"},{"term":"Atmospheric perspective","definition":"Reduced distant contrast and possible color shift from air scattering.","lesson":"s09l04","id":"glossar-atmospheric-perspective"},{"term":"Depth of field","definition":"Range of subject distances appearing acceptably sharp.","lesson":"s09l04","id":"glossar-depth-of-field"},{"term":"Gaussian Blur","definition":"Spatial smoothing weighted by Gaussian distribution.","lesson":"s04l03","id":"glossar-gaussian-blur"},{"term":"Unsharp Mask","definition":"Edge-contrast sharpening with controls Amount, Radius and Threshold.","lesson":"s08l07","id":"glossar-unsharp-mask"},{"term":"Halo","definition":"Unnatural light or dark band around an edge from edits or masking.","lesson":"s09l03","id":"glossar-halo"},{"term":"Noise","definition":"Unpredictable pixel variations from capture, processing or synthesis.","lesson":"s08l07","id":"glossar-noise"},{"term":"Denoise","definition":"Reduction of noise, often at some fine-detail cost.","lesson":"s08l07","id":"glossar-denoise"},{"term":"Texture","definition":"Small repeating or stochastic image detail.","lesson":"s05l01","id":"glossar-texture"},{"term":"Healing","definition":"Retouch method matching borrowed texture with target surroundings.","lesson":"s05l01","id":"glossar-healing"},{"term":"Cloning","definition":"Direct copying of pixels from source to target.","lesson":"s05l02","id":"glossar-cloning"},{"term":"Content-Aware Fill","definition":"Synthesizes replacement pixels using analyzed neighborhood information.","lesson":"s05l03","id":"glossar-content-aware-fill"},{"term":"Remove Tool","definition":"Photoshop retouch brush for inferred removal, with model-dependent processing.","lesson":"s05l03","id":"glossar-remove-tool"},{"term":"Frequency separation","definition":"Technique operating on different spatial scales of image detail.","lesson":"s09l06","id":"glossar-frequency-separation"},{"term":"Dodge","definition":"Local brightening operation.","lesson":"s05l05","id":"glossar-dodge"},{"term":"Burn","definition":"Local darkening operation.","lesson":"s05l05","id":"glossar-burn"},{"term":"Liquify","definition":"Specialized image geometry warp interface.","lesson":"s05l05","id":"glossar-liquify"},{"term":"Brush opacity","definition":"Maximum contribution of brush stroke across area.","lesson":"s06l01","id":"glossar-brush-opacity"},{"term":"Brush flow","definition":"Rate of paint deposition during a stroke.","lesson":"s06l01","id":"glossar-brush-flow"},{"term":"Hardness","definition":"Softness of a brush tip edge.","lesson":"s06l01","id":"glossar-hardness"},{"term":"Smoothing","definition":"Pointer path stabilization for brush strokes.","lesson":"s06l02","id":"glossar-smoothing"},{"term":"Pen pressure","definition":"Stylus force data used for brush dynamics on supported tablets.","lesson":"s06l02","id":"glossar-pen-pressure"},{"term":"Gradient","definition":"Continuous transition between colors or opacity levels.","lesson":"s06l04","id":"glossar-gradient"},{"term":"Pattern","definition":"Tiled repeated image or fill design.","lesson":"s06l04","id":"glossar-pattern"},{"term":"Foreground color","definition":"Current primary painting/fill color.","lesson":"s06l03","id":"glossar-foreground-color"},{"term":"Swatch","definition":"Saved color for repeated access.","lesson":"s06l03","id":"glossar-swatch"},{"term":"Path","definition":"Editable geometric contour defined by anchors and segments.","lesson":"s07l04","id":"glossar-path"},{"term":"Anchor point","definition":"Path control point that defines contour position.","lesson":"s07l04","id":"glossar-anchor-point"},{"term":"Bézier handle","definition":"Direction vector influencing tangent and curvature of path segment.","lesson":"s07l04","id":"glossar-b-zier-handle"},{"term":"Point type","definition":"Text entered at single click origin, extending with text.","lesson":"s07l01","id":"glossar-point-type"},{"term":"Paragraph type","definition":"Text flowing inside a sized bounding box.","lesson":"s07l01","id":"glossar-paragraph-type"},{"term":"Kerning","definition":"Spacing adjustment for a particular glyph pair.","lesson":"s07l02","id":"glossar-kerning"},{"term":"Tracking","definition":"Overall spacing across selected glyphs.","lesson":"s07l02","id":"glossar-tracking"},{"term":"Leading","definition":"Distance from one line baseline to the next.","lesson":"s07l02","id":"glossar-leading"},{"term":"Glyph","definition":"Specific drawn appearance of a character in font.","lesson":"s07l02","id":"glossar-glyph"},{"term":"Anti-aliased type","definition":"Rasterized glyph edges smoothed by partial pixel coverage.","lesson":"s07l01","id":"glossar-anti-aliased-type"},{"term":"Dynamic Text","definition":"Recent feature extending text layout along shapes/paths; availability version-specific.","lesson":"s07l05","id":"glossar-dynamic-text"},{"term":"Actions","definition":"Recorded command sequences replayable in Photoshop.","lesson":"s10l02","id":"glossar-actions"},{"term":"Batch","definition":"Automatic operation across a set of source files.","lesson":"s10l02","id":"glossar-batch"},{"term":"UXP","definition":"Modern Photoshop plugin extensibility platform.","lesson":"s10l04","id":"glossar-uxp"},{"term":"Export As","definition":"Asset-oriented export dialog distinct from editable Save As.","lesson":"s10l05","id":"glossar-export-as"},{"term":"Preflight","definition":"Structured verification of outputs against recipient technical requirements.","lesson":"s10l06","id":"glossar-preflight"},{"term":"Scratch disk","definition":"Drive space used by Photoshop for temporary working data.","lesson":"s11l01","id":"glossar-scratch-disk"},{"term":"GPU","definition":"Graphics processor accelerating compatible display and image operations.","lesson":"s11l01","id":"glossar-gpu"},{"term":"DirectX","definition":"Windows graphics API used to describe supported GPU feature levels.","lesson":"s11l02","id":"glossar-directx"},{"term":"VRAM","definition":"Graphics memory available to GPU features.","lesson":"s11l02","id":"glossar-vram"},{"term":"Virtual GPU","definition":"Graphics adapter presented by virtualization host to guest system.","lesson":"s11l02","id":"glossar-virtual-gpu"},{"term":"PCIe passthrough","definition":"Advanced technique assigning physical hardware directly to a guest where supported.","lesson":"s11l02","id":"glossar-pcie-passthrough"},{"term":"Preferences","definition":"Application configuration settings, distinct from document data.","lesson":"s01l04","id":"glossar-preferences"},{"term":"Workspace","definition":"Stored UI panel arrangement.","lesson":"s01l04","id":"glossar-workspace"},{"term":"History state","definition":"Session snapshot of editing actions, not permanent backup.","lesson":"s01l06","id":"glossar-history-state"},{"term":"Generative credits","definition":"Plan-based metering of certain Adobe and partner AI operations.","lesson":"s11l06","id":"glossar-generative-credits"},{"term":"Generative Fill","definition":"Prompt-based image insertion/removal/replacement using supported generative service.","lesson":"s11l06","id":"glossar-generative-fill"},{"term":"On-device model","definition":"ML model running locally after installation and hardware checks.","lesson":"s11l06","id":"glossar-on-device-model"},{"term":"Beta","definition":"Pre-release feature/channel not to be assumed stable or permanent.","lesson":"s11l06","id":"glossar-beta"},{"term":"LTS","definition":"Long-term-support release branch with extended security/maintenance policy.","lesson":"s11l06","id":"glossar-lts"},{"term":"Brush spacing","definition":"Distance between individual brush-tip imprints; smaller spacing generally produces smoother continuous strokes.","lesson":"s06l01","id":"glossar-brush-spacing"},{"term":"Brush jitter","definition":"Controlled randomness in size, angle, position or color of repeated brush marks.","lesson":"s06l02","id":"glossar-brush-jitter"},{"term":"ICC rendering intent","definition":"Rule for mapping colors between gamuts during a conversion, especially perceptual versus relative colorimetric.","lesson":"s08l06","id":"glossar-icc-rendering-intent"},{"term":"Smart Filter stacking","definition":"Order of filters attached to Smart Objects; changing order can change the final image.","lesson":"s04l03","id":"glossar-smart-filter-stacking"},{"term":"Clipped adjustment","definition":"An adjustment constrained by the underlying layer or clip base, distinct from masking by painted gray values.","lesson":"s04l01","id":"glossar-clipped-adjustment"},{"term":"Alpha lock","definition":"Prevents painting into fully transparent areas on supported raster layers.","lesson":"s02l04","id":"glossar-alpha-lock"},{"term":"Export preflight","definition":"Final inspection of dimensions, color profile, transparency, filenames and deliverable requirements.","lesson":"s10l05","id":"glossar-export-preflight"}],"troubleshooting":[{"symptom":"Photoshop won't launch","cause":"Outdated driver; corrupt preferences; plugin fault; unsupported Windows build","diagnosis":"Check Help/Creative Cloud version and Windows Event Viewer; launch without optional plugins; test fresh user settings","solution":"Update to compatible driver and supported OS; preserve settings before reset","warning":"Do not delete the only preference backup","lesson":"s11l03","id":"troubleshootin-photoshop-won-t-launch"},{"symptom":"Scratch disks are full","cause":"Insufficient free storage; huge temporary documents","diagnosis":"Inspect free internal SSD space and scratch preference assignments","solution":"Free disk safely after closing Photoshop; add suitable SSD scratch disk","warning":"Do not manually delete active Photoshop scratch files","lesson":"s11l01","id":"troubleshootin-scratch-disks-are-full"},{"symptom":"GPU unavailable or grayed out","cause":"Unsupported DX12 feature level; VM virtual adapter; driver issue","diagnosis":"Help > System Info and Device Manager > Display adapters","solution":"Install vendor driver or provide supported GPU to guest; accept feature limits if not possible","warning":"Do not assume host GPU is visible inside VM","lesson":"s11l02","id":"troubleshootin-gpu-unavailable-or-grayed-out"},{"symptom":"Blur Gallery / Oil Paint missing","cause":"GPU unsupported, color depth/mode incompatible","diagnosis":"Edit > Preferences > Performance and Image > Mode","solution":"Enable suitable GPU and test supported mode after saving copy","warning":"Converting bit depth can change image precision","lesson":"s11l01","id":"troubleshootin-blur-gallery-oil-paint-missing"},{"symptom":"Camera Raw Filter disabled","cause":"Unsupported bit depth or layer type","diagnosis":"Image > Mode; selected layer properties","solution":"Try supported 8/16-bit copy and suitable Smart Object","warning":"Preserve 32-bit HDR original","lesson":"s08l04","id":"troubleshootin-camera-raw-filter-disabled"},{"symptom":"Generative Fill gray","cause":"Missing selection; unsupported RGB/bit depth; login or internet/credits","diagnosis":"Check mode, layer, selection, account connectivity","solution":"Use supported RGB 8-bit workflow and verify plan entitlement","warning":"Do not bypass cloud/account restrictions","lesson":"s11l06","id":"troubleshootin-generative-fill-gray"},{"symptom":"Remove Tool fails","cause":"Unsupported on-device model; networking; GPU; source complexity","diagnosis":"Check model selection, installed state and image mode","solution":"Select compatible processing and refine with healing/cloning","warning":"Inferred replacement may alter scene facts","lesson":"s05l03","id":"troubleshootin-remove-tool-fails"},{"symptom":"Brush paints nothing","cause":"Wrong layer/mask; hidden layer; zero flow/opacity; selection active","diagnosis":"Inspect layer thumbnail and brush controls; Ctrl+D if unintended selection","solution":"Choose correct editable target, set opacity/flow, unlock","warning":"Avoid accidental painting on master","lesson":"s06l01","id":"troubleshootin-brush-paints-nothing"},{"symptom":"Layer won't move","cause":"Locked layer; wrong target; auto-select settings","diagnosis":"Inspect layer lock and Layers selection","solution":"Unlock permitted layers and select correct layer","warning":"Do not flatten merely to enable move","lesson":"s02l03","id":"troubleshootin-layer-won-t-move"},{"symptom":"Cannot select subject accurately","cause":"Weak contrast; motion blur; transparency and hair","diagnosis":"Inspect at 100% on light/dark backgrounds","solution":"Combine Object Selection with Select and Mask and local brush refinements","warning":"Do not claim perfect AI edge in all lighting","lesson":"s03l04","id":"troubleshootin-cannot-select-subject-accurately"},{"symptom":"Mask shows black or white unexpectedly","cause":"Selected mask thumbnail; inverted mask; wrong brush color","diagnosis":"Alt-click mask and inspect white/black coverage","solution":"Press D/X for default and swap colors; Ctrl+I deliberately only when appropriate","warning":"Do not delete hidden source pixels","lesson":"s03l03","id":"troubleshootin-mask-shows-black-or-white-unexpectedly"},{"symptom":"Export has white background","cause":"Opaque layer still visible; wrong format; transparency disabled","diagnosis":"Hide all background layers and inspect checkerboard","solution":"Export PNG with transparency, retest in viewer","warning":"JPEG does not store transparency","lesson":"s02l04","id":"troubleshootin-export-has-white-background"},{"symptom":"PNG edges have halos","cause":"Selection fringe; premultiplication; matte mismatch","diagnosis":"View over dark and bright test layers","solution":"Refine mask and decontaminate only as needed","warning":"Strong feather can worsen fringing","lesson":"s09l03","id":"troubleshootin-png-edges-have-halos"},{"symptom":"Text font missing","cause":"Font not installed/licensed; creative cloud sync","diagnosis":"Inspect Type warning and Character panel font","solution":"Install licensed font or intentionally substitute and reflow","warning":"Do not redistribute restricted fonts","lesson":"s11l04","id":"troubleshootin-text-font-missing"},{"symptom":"Text wraps differently","cause":"Missing font, differing tracking or bounding box","diagnosis":"Check exact font, Paragraph width and Character settings","solution":"Use installed font and fixed style guide","warning":"Do not rasterize master just to conceal issue","lesson":"s07l02","id":"troubleshootin-text-wraps-differently"},{"symptom":"Shortcut types into field","cause":"Focus is in text input; custom shortcuts","diagnosis":"Press Esc/click away; inspect Edit > Keyboard Shortcuts","solution":"Exit active text field then retry","warning":"Key mappings differ if customized","lesson":"s01l04","id":"troubleshootin-shortcut-types-into-field"},{"symptom":"Ctrl+Z behaves differently","cause":"Text field focus; undo/redo context","diagnosis":"Inspect History panel and active caret","solution":"Exit field and test known document operation","warning":"Undo buffer isn't a backup","lesson":"s01l06","id":"troubleshootin-ctrl-z-behaves-differently"},{"symptom":"Colors look different in viewer","cause":"Profile missing; uncalibrated display; unmanaged app","diagnosis":"Check embedded ICC and proof view; compare in color-managed viewer","solution":"Convert with correct profile, embed it on export as supported","warning":"Assigning arbitrary profile may distort appearance","lesson":"s08l05","id":"troubleshootin-colors-look-different-in-viewer"},{"symptom":"Print too dark","cause":"Screen brightness; missing output profile; uncalibrated printer","diagnosis":"Review soft proof and test print with printer/paper ICC","solution":"Calibrate monitor and use correct output workflow","warning":"No universal one-click print fix","lesson":"s08l06","id":"troubleshootin-print-too-dark"},{"symptom":"Gradients show banding","cause":"8-bit quantization; aggressive stretch; export artifacts","diagnosis":"Inspect at 100% in PSD then final export","solution":"Work at higher precision when appropriate; add modest dither/noise","warning":"Some delivery formats reintroduce banding","lesson":"s06l04","id":"troubleshootin-gradients-show-banding"},{"symptom":"Large PSD slow","cause":"Memory/scratch pressure; excessive layers; high pixel count","diagnosis":"Inspect Photoshop Performance and Windows Task Manager","solution":"Use organized Smart Objects, adequate RAM and SSD scratch","warning":"Flatten only a delivery copy","lesson":"s11l05","id":"troubleshootin-large-psd-slow"},{"symptom":"PSD too large to save","cause":"Exceeds PSD limits","diagnosis":"Review dimensions and file size","solution":"Use PSB if receiver supports it","warning":"PSB acceptance varies by downstream application","lesson":"s11l05","id":"troubleshootin-psd-too-large-to-save"},{"symptom":"Linked files missing","cause":"Paths moved or omitted from handoff","diagnosis":"Inspect layer link warning and project folder","solution":"Relink to shipped source files and re-save copy","warning":"Do not send only PSD if links remain external","lesson":"s10l01","id":"troubleshootin-linked-files-missing"},{"symptom":"Corrupt file","cause":"Interrupted write; storage trouble; plugin problem","diagnosis":"Try earlier versioned files and verified backups","solution":"Restore known-good copy and investigate storage","warning":"Never overwrite last working revision","lesson":"s11l05","id":"troubleshootin-corrupt-file"},{"symptom":"Photoshop in VM very slow","cause":"No passed GPU; low RAM/vRAM; disk I/O","diagnosis":"Inspect guest GPU capabilities and scratch location","solution":"Allocate adequate guest resources, test appropriate hypervisor GPU features","warning":"Official host spec is not a VM guarantee","lesson":"s11l02","id":"troubleshootin-photoshop-in-vm-very-slow"},{"symptom":"Cloud feature unavailable offline","cause":"Requires sign-in, credits, cloud request","diagnosis":"Check service docs and account; disconnect only for safe test","solution":"Use manual masking, heal, clone and local adjustment tools","warning":"Offline manual is not offline AI service","lesson":"s11l06","id":"troubleshootin-cloud-feature-unavailable-offline"},{"symptom":"Export size wrong","cause":"Resampling settings, ratio, artboard bounds","diagnosis":"Inspect File > Export > Export As preview dimensions","solution":"Set explicit dimensions and verify exported pixel size","warning":"Print PPI != pixel count","lesson":"s10l05","id":"troubleshootin-export-size-wrong"},{"symptom":"Smart Filter missing","cause":"Layer wasn't Smart Object or operation not supported","diagnosis":"Inspect filter target and layer icon","solution":"Convert eligible layer before filter; confirm smart compatibility","warning":"Not every filter is smart-compatible","lesson":"s04l03","id":"troubleshootin-smart-filter-missing"},{"symptom":"Over-sharpened edges","cause":"Amount/Radius too strong; repeated sharpening","diagnosis":"Inspect at 100% against original","solution":"Lower sharpening and apply after final resize","warning":"Halos cannot create authentic detail","lesson":"s08l07","id":"troubleshootin-over-sharpened-edges"},{"symptom":"Automated batch overwrites files","cause":"Save path recorded; filename collision","diagnosis":"Test one input and output folder before batch","solution":"Use separate destination and unique naming","warning":"Always preserve originals outside destination","lesson":"s10l02","id":"troubleshootin-automated-batch-overwrites-files"}],"recipes":[{"title":"Remove a simple solid-color background","requires":["s03l02","s03l03"],"procedure":"Select background with Magic Wand or Color Range; inspect tolerance; add layer mask; refine at 100%; export PNG with alpha.","pass":"Transparent PNG with no obvious fringes.","id":"recipe-remove-a-simple-solid-color-background"},{"title":"Extract hair against mixed tones","requires":["s03l04","s03l03"],"procedure":"Select subject roughly; enter Select and Mask; check dark/light previews; use edge refinement cautiously; output New Layer with Mask; test on two backdrops.","pass":"No prominent halo or lost major strands.","id":"recipe-extract-hair-against-mixed-tones"},{"title":"Replace a sky without flattening","requires":["s03l03","s04l02","s09l03"],"procedure":"Duplicate source; mask the sky; place replacement beneath; match horizon and exposure using clipped Curves; inspect tree edges.","pass":"Sky change can be undone by turning off replacement.","id":"recipe-replace-a-sky-without-flattening"},{"title":"Restore a clipped logo edge","requires":["s03l06","s07l04"],"procedure":"Trace Pen path with few anchors; form vector mask; adjust handles at 200%; evaluate final-size export.","pass":"Sharp smooth edge without stair-step trace.","id":"recipe-restore-a-clipped-logo-edge"},{"title":"Make a circular profile image","requires":["s03l01","s03l03"],"procedure":"Make elliptical selection; apply Reveal Selection mask; center portrait; export transparent PNG.","pass":"Correct circular alpha boundary.","id":"recipe-make-a-circular-profile-image"},{"title":"Brighten only a face","requires":["s04l01","s05l05"],"procedure":"Add Curves brighten layer; invert mask; soft-white low-opacity paint on face; compare before/after.","pass":"Background retains original exposure.","id":"recipe-brighten-only-a-face"},{"title":"Remove a small blemish","requires":["s05l01"],"procedure":"Make blank cleanup layer; sample all layers; paint just over defect with Spot Healing; examine at 100%.","pass":"Texture continuous and source unchanged.","id":"recipe-remove-a-small-blemish"},{"title":"Clone a scratch across repeated texture","requires":["s05l02"],"procedure":"Sample near defect with Alt-click; clone short segments while frequently resampling; check for repeated motifs.","pass":"Scratch invisible without repetitive patches.","id":"recipe-clone-a-scratch-across-repeated-texture"},{"title":"Rebuild damaged image corner","requires":["s05l06","s05l02"],"procedure":"Save archival copy; select good similar region; clone geometric structure on new layer; document inference; blend tone.","pass":"Corner improved and reconstruction documented.","id":"recipe-rebuild-damaged-image-corner"},{"title":"Remove a cable from wall","requires":["s05l03","s05l02"],"procedure":"Paint cable using Remove; inspect texture and vertical lines; fix repetitions with Clone/Healing; save editable layer.","pass":"No duplicate wall details.","id":"recipe-remove-a-cable-from-wall"},{"title":"Retouch skin without waxy blur","requires":["s05l04","s05l05"],"procedure":"Heal isolated marks; dodge/burn subtle uneven tone on Curves masks; inspect pores at 100%.","pass":"Texture remains natural.","id":"recipe-retouch-skin-without-waxy-blur"},{"title":"Make a realistic contact shadow","requires":["s09l02","s04l03"],"procedure":"Paint tight dark mark directly under object; separate softer longer shadow; blur on Smart Object; reduce opacity.","pass":"Subject visually rests on floor.","id":"recipe-make-a-realistic-contact-shadow"},{"title":"Match lighting on a cutout","requires":["s09l01","s09l03"],"procedure":"Identify light direction; clip Curves and Color Balance to subject; refine masked edge; compare black point.","pass":"Subject and scene share illumination logic.","id":"recipe-match-lighting-on-a-cutout"},{"title":"Create fake atmospheric depth","requires":["s09l04"],"procedure":"Place distant objects in separate group; mask pale fog layer to distance; reduce distant contrast and blur slightly.","pass":"Foreground stays crisp and distance recedes.","id":"recipe-create-fake-atmospheric-depth"},{"title":"Make a glass-style highlight","requires":["s04l04","s09l02"],"procedure":"Paint small controlled highlight on separate Screen layer; mask edges to shape; soften one side; align to scene light.","pass":"Highlight reinforces form without milky haze.","id":"recipe-make-a-glass-style-highlight"},{"title":"Apply print-like grain","requires":["s09l06","s08l07"],"procedure":"Create a grain layer with Add Noise; use blending and opacity modestly; evaluate at final output scale.","pass":"Grain integrates rather than overwhelms.","id":"recipe-apply-print-like-grain"},{"title":"Make a sharp product label","requires":["s07l03","s07l02"],"procedure":"Use shape path for label; set editable type; use consistent guides and padding; add subtle Stroke.","pass":"High contrast, legible at actual size.","id":"recipe-make-a-sharp-product-label"},{"title":"Create a magazine cover","requires":["s07l02","s07l06"],"procedure":"Place photograph; use three text hierarchy levels; keep safe margins; test contrast with image; export proof.","pass":"Readable title, subhead and caption.","id":"recipe-create-a-magazine-cover"},{"title":"Place a logo on fabric","requires":["s09l05","s04l04"],"procedure":"Create grayscale displacement PSD of folds; apply Displace to logo Smart Object if supported; blend fabric shadow through logo; compare at 100%.","pass":"Folds subtly affect logo without excessive warping.","id":"recipe-place-a-logo-on-fabric"},{"title":"Prepare social post variants","requires":["s10l03","s10l05"],"procedure":"Duplicate master, adapt square and portrait canvas; reflow text; inspect every edge; export at specified pixel sizes.","pass":"Two consistent, non-cropped exports.","id":"recipe-prepare-social-post-variants"},{"title":"Batch resize event thumbnails","requires":["s10l02","s10l05"],"procedure":"Record safe resize action; test on one, then three files; Batch to separate output folder; validate dimensions.","pass":"All thumbnails consistent, originals untouched.","id":"recipe-batch-resize-event-thumbnails"},{"title":"Export transparent UI icon","requires":["s02l04","s07l03","s10l05"],"procedure":"Create shape layer in transparent canvas; export PNG with transparency; reopen over dark and light backgrounds.","pass":"Crisp alpha on both backgrounds.","id":"recipe-export-transparent-ui-icon"},{"title":"Prepare for print","requires":["s08l05","s08l06","s10l06"],"procedure":"Confirm bleed with printer; verify pixel dimensions and embedded profile; soft proof using provided paper ICC; export as required.","pass":"Printer-specific checklist completed.","id":"recipe-prepare-for-print"},{"title":"Create a sharp website hero","requires":["s02l01","s08l07","s10l05"],"procedure":"Crop nondestructively to final ratio; resize delivery copy; apply moderate output sharpen; export suitable JPEG/WebP if receiver supports.","pass":"Clean final pixels without sharpening halos.","id":"recipe-create-a-sharp-website-hero"},{"title":"Fix magenta/green cast","requires":["s08l02","s08l03"],"procedure":"Select neutral sample; adjust green channel Curve or Color Balance gently; inspect flesh tones; constrain with mask.","pass":"Neutrals more plausible without clipped channels.","id":"recipe-fix-magenta-green-cast"},{"title":"Build an editable color grade","requires":["s04l01","s08l03"],"procedure":"Make Curves for contrast and a separate Hue/Saturation or Color Balance layer; name by effect; compare at reduced size.","pass":"Grade can be disabled in one click.","id":"recipe-build-an-editable-color-grade"},{"title":"Create type on a curve","requires":["s07l04","s07l05"],"procedure":"Draw Pen path; click with Type Tool; enter short phrase; adjust tracking and start position; keep text layer editable.","pass":"Glyphs flow smoothly without collisions.","id":"recipe-create-type-on-a-curve"},{"title":"Make a three-level digital painting","requires":["s06l01","s06l06"],"procedure":"Separate background, midground and subject; establish grayscale value hierarchy; introduce limited hue palette; inspect thumbnail.","pass":"Focal region readable without detail.","id":"recipe-make-a-three-level-digital-painting"},{"title":"Repair an overexposed image modestly","requires":["s08l01","s08l04"],"procedure":"Inspect histogram; reduce highlights using Camera Raw or Light adjustment; check whether original channels retain data; avoid inventing recovery.","pass":"Improvement without fabricated texture claims.","id":"recipe-repair-an-overexposed-image-modestly"},{"title":"Package an editable handoff","requires":["s10l01","s04l06"],"procedure":"Bundle source/work/exports; audit links and fonts; save PSD plus preview; reopen from moved folder.","pass":"Another computer can relink and review without guessing.","id":"recipe-package-an-editable-handoff"},{"title":"Make a reversible crop","requires":["s02l01"],"procedure":"Select Crop Tool; disable Delete Cropped Pixels; commit; inspect outside frame by expanding crop; keep a layered master.","pass":"Original crop area can be recovered before final delivery.","id":"recipe-make-a-reversible-crop"},{"title":"Clean a mask fringe","requires":["s03l03","s03l04"],"procedure":"Place subject against white and black layers; open Select and Mask; try restrained edge refinement and Decontaminate Colors only when outputting safely to a separate result; inspect at 100%.","pass":"Edges remain clean on both backgrounds with original mask retained.","id":"recipe-clean-a-mask-fringe"},{"title":"Build controlled rim lighting","requires":["s04l01","s05l05"],"procedure":"Create a Curves brighten adjustment, invert mask to black, paint a low-flow soft white edge on subject side and adjust opacity.","pass":"Lighting direction is consistent and no harsh white outline appears.","id":"recipe-build-controlled-rim-lighting"},{"title":"Create multiple editable artboard sizes","requires":["s02l02","s10l05"],"procedure":"Create artboards for distinct delivery sizes; reuse linked Smart Objects and text; inspect each trim independently; export artboards per output constraints.","pass":"Each exported variant has expected dimensions and editable text in the master.","id":"recipe-create-multiple-editable-artboard-sizes"},{"title":"Check missing linked assets","requires":["s04l02","s10l01"],"procedure":"Inspect Layers for warning icons; check File > Package where available; duplicate project folder and reopen; relink from included source folder.","pass":"Transferred project opens with the intended original linked graphics.","id":"recipe-check-missing-linked-assets"},{"title":"Verify a transparent export","requires":["s02l04","s10l05"],"procedure":"Hide all opaque background layers; use Export As > PNG with transparency; reopen against dark and light backgrounds.","pass":"No white rectangular matte or unwanted halo remains.","id":"recipe-verify-a-transparent-export"},{"title":"Inspect two different ICC previews","requires":["s08l05","s08l06"],"procedure":"Preserve RGB master; set destination in View > Proof Setup > Custom; toggle Proof Colors; compare with profile embedded in final exported copy.","pass":"Report identifies soft-proof profile and documents visible changes without overwriting master.","id":"recipe-inspect-two-different-icc-previews"},{"title":"Compare blur as Smart Filter and raster edit","requires":["s04l02","s04l03"],"procedure":"Duplicate an image layer; convert one copy to Smart Object and apply Gaussian Blur; blur other raster copy directly; close and reopen PSD; try editing both.","pass":"Smart Filter settings remain separately adjustable; direct blur is baked into raster pixels.","id":"recipe-compare-blur-as-smart-filter-and-raster-edit"},{"title":"Inspect a suspicious keyboard shortcut","requires":["s01l04","s11l03"],"procedure":"Open Edit > Keyboard Shortcuts (Ctrl+Alt+Shift+K); choose Tools or Application Menus; record exact assigned key; compare with manual and look for user customization.","pass":"Report distinguishes installed assignment from historical or documented default.","id":"recipe-inspect-a-suspicious-keyboard-shortcut"},{"title":"Separate AI-generated and recovered content","requires":["s05l07","s11l06"],"procedure":"Save archival original; keep AI-assisted reconstruction on a named layer; label uncertain invented detail; include original plus change log in handoff.","pass":"A reviewer can see which regions were authentically preserved and which were inferred.","id":"recipe-separate-ai-generated-and-recovered-content"}],"changes":[{"feature":"Light adjustment layer","status":"stable","introduced":"27.10 (August 2026)","meaning":"Exposure, Contrast, Highlights, Shadows, Whites and Blacks on live adjustment layer."},{"feature":"Enhance edge","status":"stable","introduced":"27.11 (September 2026)","meaning":"AI-powered selection edge refinement; cloud/model conditions need current in-app check."},{"feature":"GPT Image 2 model","status":"online model option","introduced":"27.11 (September 2026)","meaning":"Available for Generate Image/Prompt to edit as listed in release notes; entitlement/model list may change."},{"feature":"On-device Remove Tool model","status":"stable, conditional","introduced":"27.7 (May 2026)","meaning":"Downloadable local model on supported hardware; not the same as all generative features working offline."},{"feature":"Generative Fill / Generate Image / Harmonize","status":"online/service","introduced":"features of stable release","meaning":"Account, service, generative credits and sometimes model picker required."},{"feature":"AI Assisted Editor","status":"Beta","introduced":"27.10 (August 2026)","meaning":"Explicit Beta; not required curriculum and not treated as stable."},{"feature":"Modernized Toolbar and Tool Options","status":"Beta","introduced":"Oct 15, 2026 Beta announcement","meaning":"Not assumed in the 27.11 stable UI."},{"feature":"Dynamic Text along shapes/paths","status":"stable","introduced":"27.6/27.10 (2026)","meaning":"Newer controls; ordinary editable path text taught as universal prerequisite."},{"feature":"Save As format customization","status":"stable","introduced":"27.10 (August 2026)","meaning":"Show, hide and reorder formats in Save As and Save a Copy dialogs."},{"feature":"Recent document presets management","status":"stable","introduced":"27.11 (September 2026)","meaning":"Rename/delete Recents in New Document dialog."},{"feature":"3D legacy tools","status":"removed","introduced":"legacy, removed before 27.11","meaning":"Do not use old 3D tutorials as current Photoshop production commands."},{"feature":"Save for Web","status":"legacy / hidden by default","introduced":"older workflow","meaning":"Use Export As in modern workflow; historical recipes may mention Save for Web."},{"feature":"LTS maintenance branch","status":"separate version","introduced":"26.11.8 as of Oct 13, 2026","meaning":"Not same as current feature branch 27.11."},{"feature":"Camera Raw","status":"separately versioned plugin","introduced":"18.7 installer listed Sep 2026","meaning":"Check Help > About Plug-In > Camera Raw; do not confuse with Photoshop version."}],"sources":[{"title":"Adobe Photoshop desktop release notes","url":"https://helpx.adobe.com/photoshop/desktop/whats-new/photoshop-on-desktop-release-notes.html","evidence":"Last updated Oct 5, 2026. September 2026 version 27.11; recent feature changes in 27.6–27.11.","checked":"2026-10-28"},{"title":"Adobe Photoshop security bulletin APSB26-158","url":"https://www.adobe.com/trust/security/products/photoshop/apsb26-158.html","evidence":"Published Oct 13, 2026. Photoshop 2026 fixed/updated at 27.11, and LTS branch 26.11.8; confirms patch baseline.","checked":"2026-10-28"},{"title":"Adobe supported Photoshop versions","url":"https://helpx.adobe.com/photoshop/desktop/get-started/technical-requirements-installation/photoshop-supported-versions.html","evidence":"Sep 28, 2026. Stable current 27.x and prior 26.x; Help > About Photoshop on Windows.","checked":"2026-10-28"},{"title":"Adobe desktop technical requirements","url":"https://helpx.adobe.com/photoshop/desktop/get-started/technical-requirements-installation/adobe-photoshop-on-desktop-technical-requirements.html","evidence":"Sep 9, 2026. Windows requirements for 27.x; CPU/RAM/GPU/DirectX/scratch/internet.","checked":"2026-10-28"},{"title":"Adobe View keyboard shortcuts","url":"https://helpx.adobe.com/photoshop/desktop/get-started/settings-and-preferences/view-keyboard-shortcuts.html","evidence":"Sep 8, 2026. Edit > Keyboard Shortcuts and Ctrl+Alt+Shift+K; shortcut override verification method.","checked":"2026-10-28"},{"title":"Adobe filter effects reference","url":"https://helpx.adobe.com/photoshop/desktop/effects-filters/blur-sharpen-filters/filter-effects-reference.html","evidence":"Oct 4, 2026. Blur, sharpen, sketch and other filter classifications and bit-depth caveats.","checked":"2026-10-28"},{"title":"Adobe filters overview","url":"https://helpx.adobe.com/photoshop/desktop/effects-filters/get-started-with-filters/filters-overview.html","evidence":"Feb 23, 2026. Categories, Smart Filter compatibility and filter restrictions.","checked":"2026-10-28"},{"title":"Adobe Filter Gallery overview","url":"https://helpx.adobe.com/photoshop/desktop/effects-filters/get-started-with-filters/filter-gallery.html","evidence":"Current Adobe gallery descriptions and category explanations.","checked":"2026-10-28"},{"title":"Adobe Adjust image lighting with Light","url":"https://helpx.adobe.com/photoshop/desktop/create-manage-layers/color-adjustment-fill-layers/adjust-image-lighting-with-light.html","evidence":"Sep 9, 2026. Light adjustment layer introduced in 27.10 and six controls.","checked":"2026-10-28"},{"title":"Adobe adjust image color and tone","url":"https://helpx.adobe.com/photoshop/desktop/adjust-color/color-corrections/adjust-image-color-and-tone.html","evidence":"Sep 30, 2026. Adjustment layers versus Camera Raw and mask behavior.","checked":"2026-10-28"},{"title":"Adobe Generative Fill desktop","url":"https://helpx.adobe.com/photoshop/desktop/create-open-import-images/create-images/edit-images-with-generative-fill.html","evidence":"Sep 2026. Selection-based generative edits, model picker and output variations.","checked":"2026-10-28"},{"title":"Adobe generative AI overview","url":"https://helpx.adobe.com/photoshop/desktop/generative-ai/generative-ai-features-overview.html","evidence":"May 20, 2026. Cloud generative features and credits.","checked":"2026-10-28"},{"title":"Adobe generative troubleshooting","url":"https://helpx.adobe.com/photoshop/kb/troubleshoot-generative-ai-features.html","evidence":"Mode/bit-depth/selection, account/internet and credits requirements may constrain Generative Fill.","checked":"2026-10-28"},{"title":"Adobe on-device Remove model release evidence","url":"https://helpx.adobe.com/photoshop/desktop/whats-new/photoshop-on-desktop-release-notes.html","evidence":"May 2026 feature update: Remove local model after download and hardware check.","checked":"2026-10-28"},{"title":"Adobe filters troubleshooting","url":"https://helpx.adobe.com/photoshop/desktop/troubleshoot/tool-feature-issues/filters-and-effects-errors.html","evidence":"Oct 4, 2026. Filter limitations; GPU and mode diagnostics.","checked":"2026-10-28"},{"title":"Adobe Shake Reduction removal notice","url":"https://helpx.adobe.com/photoshop/using/reduce-camera-shake-induced-blurring.html","evidence":"May 2023. Adobe confirms removal starting with Photoshop 23.3 (April 2022); legacy only in 27.11.","checked":"2026-10-28"},{"title":"Adobe Topaz AI Sharpen and AI Denoise","url":"https://helpx.adobe.com/in/photoshop/desktop/effects-filters/artistic-stylize-filters/enhance-images-with-generative-ai-filters.html","evidence":"December 2025. Filter > AI Sharpen / Filter > AI Denoise, premium usage credits, 56 MP file limit and active-layer replacement.","checked":"2026-10-28"},{"title":"Adobe GPU setup","url":"https://helpx.adobe.com/photoshop/desktop/get-started/technical-requirements-installation/enable-photoshop-to-use-the-graphics-processor.html","evidence":"Feb 23, 2026. Edit > Preferences > Performance on Windows.","checked":"2026-10-28"},{"title":"Adobe Camera Raw introduction","url":"https://helpx.adobe.com/camera-raw/desktop/get-started/overview-and-setup/introduction-camera-raw.html","evidence":"Sep 29, 2026. RAW processing, metadata sidecars and Smart Object workflow.","checked":"2026-10-28"},{"title":"Adobe Camera Raw installer","url":"https://helpx.adobe.com/camera-raw/desktop/troubleshoot/camera-raw-plug-in-installer.html","evidence":"Sep 29, 2026. Lists Camera Raw 18.7 installer; plug-in version may vary from Photoshop.","checked":"2026-10-28"},{"title":"Adobe camera raw GPU troubleshooting","url":"https://helpx.adobe.com/camera-raw/desktop/troubleshoot/acr-gpu-faq.html","evidence":"GPU compatibility and guest/driver diagnostics.","checked":"2026-10-28"},{"title":"Adobe Photoshop preset file locations","url":"https://helpx.adobe.com/photoshop/desktop/apply-painting-techniques/brushes-presets/photoshop-presets-locations.html","evidence":"Legacy 3D removed; Save for Web legacy hidden since 23.0 according to current Adobe note.","checked":"2026-10-28"},{"title":"Adobe Add layer masks","url":"https://helpx.adobe.com/photoshop/desktop/create-masks/layer-masks/add-layer-masks.html","evidence":"Dec 2025. Reveal and hide selections and mask gestures on Windows.","checked":"2026-10-28"},{"title":"Adobe linked Smart Objects","url":"https://helpx.adobe.com/photoshop/desktop/create-manage-layers/smart-objects/create-linked-smart-objects.html","evidence":"Feb 23, 2026. File > Place Linked and linked layer icon.","checked":"2026-10-28"},{"title":"Adobe Smart Objects overview","url":"https://helpx.adobe.com/photoshop/desktop/create-manage-layers/smart-objects/smart-objects-overview-and-benefits.html","evidence":"Feb 23, 2026. Editable transforms/filters, embedded versus linked, and painting limits.","checked":"2026-10-28"},{"title":"Adobe package linked Smart Objects","url":"https://helpx.adobe.com/photoshop/desktop/create-manage-layers/smart-objects/package-linked-smart-objects.html","evidence":"Feb 23, 2026. File > Package; include linked assets for portable delivery.","checked":"2026-10-28"},{"title":"Adobe Remove objects tool","url":"https://helpx.adobe.com/photoshop/desktop/repair-retouch/remove-objects-fill-space/remove-unw     const m = event.data;
    try {
      if (m.type === 'initialize') {
        navigation=m.navigation;window.ManualVim?.set(m.vim);
        if (m.state && !(updatedAt>(m.updatedAt||0))) {
          try {adapter.set(adapter.validate(m.state));updatedAt=m.updatedAt||0;lastState=JSON.stringify(adapter.get());if(updatedAt)saveModified();}
          catch (error) {send({type:'warning',error:'Saved library progress was invalid; the reader’s own record was retained. '+error.message});}
        }
        if (m.preferences) adapter.preferences(m.preferences);
        initialized = true;
        if (m.route) navigate(m.route);
        publish();
      } else if(m.type==='vim'){window.ManualVim?.set(m.value);}
      else if (m.type === 'navigate') {if(m.navigation<navigation)return;navigation=m.navigation;navigate(m.route);}
      else if (m.type === 'preferences') {adapter.preferences(m.value); publish();}
      else if (m.type === 'validate') {
        adapter.validate(m.value);
        send({type:'response', request:m.request, ok:true});
      } else if (m.type === 'restore') {
        adapter.set(adapter.validate(m.value));if(m.route)navigate(m.route);publish();
        send({type:'response', request:m.request, ok:true});
      } else if (m.type === 'read') {publish();send({type:'response',request:m.request,ok:true,value:{updatedAt,state:adapter.get(),route:route(),progress:adapter.progress(),storage:adapter.storage()}});}
      else if (m.type === 'focus') {document.getElementById('main')?.focus();}
      else if (m.type === 'print') window.print();
    } catch (error) {send({type:'response', request:m.request, ok:false, error:error.message});}
  });
  document.addEventListener('click', event => {
    const link=event.target.closest('a[href]');
    if(link&&/^https?:/.test(link.href)){link.target='_blank';link.rel='noopener noreferrer';}
  }, true);
  // Keep one parent history entry per link; native readers retain their hash routers.
  document.addEventListener('click', event => {
    if(!framed)return;
    const link = event.target.closest('a[href^="#"]');
    if (!link || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey || event.button !== 0 || link.target === '_blank' || link.classList.contains('skip') || link.id === 'skipContent' || link.id === 'skip-link') return;
    const value = link.getAttribute('href').replace(/^#\/?/, '');
    // Markdown guide fragments are document anchors, not application routes.
    if (adapter.id === 'premiere' && link.closest('.guide-article')) return;
    event.preventDefault();
    send({type:'navigate', route:value || adapter.home});
  }, true);
  document.addEventListener('keydown', event => {if (framed&&(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();send({type:'search'});return;}if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'p') {event.preventDefault();window.print();}});
  window.addEventListener('hashchange', publish);
  document.addEventListener('change', window.manualChanged);
  document.addEventListener('input', window.manualChanged);
  document.addEventListener('click', window.manualChanged);
  document.addEventListener('vim-change',event=>send({type:'vim',value:event.detail}));
  document.addEventListener('vim-search',()=>{if(framed)send({type:'search'});else{const input=document.getElementById('globalSearch')||document.getElementById('searchInput');if(input)input.focus();else location.hash='#/search';}});
  send({type:'ready'});
})();
</script>
</body>
